<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 관리 시스템</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* =========================================
           1. CSS 변수 및 공통 리셋
           ========================================= */
        :root {
            --color-primary: #4338CA;
            --color-primary-light: #EEF2FF;
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-text-main: #1E293B;
            --color-text-sub: #64748B;
            --color-border: #E2E8F0;
            --status-wait: #94A3B8;
            --status-ing: #2563EB;
            --status-hold: #F59E0B;
            --status-done: #10B981;
            --border-radius-sm: 6px;
            --border-radius: 12px;
            --font-family: 'Pretendard', sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --color-bg: #0F172A; --color-surface: #1E293B; --color-text-main: #F8FAFC; --color-text-sub: #E2E8F0;
            --color-border: #334155; --color-primary-light: #312E81;
        }
        body.dark-mode * { color: #F8FAFC !important; }
        body.dark-mode .input-text, body.dark-mode .inline-input, body.dark-mode .inline-select, body.dark-mode select.input-text { background: #0F172A !important; border-color: #475569 !important; color: #F8FAFC !important; }
        body.dark-mode .input-text:focus, body.dark-mode .inline-input:focus, body.dark-mode .inline-select:focus { box-shadow: 0 0 0 3px #312E81 !important; border-color: #818CF8 !important; }
        body.dark-mode input[type="month"]::-webkit-calendar-picker-indicator, body.dark-mode input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        body.dark-mode .btn-outline { border-color: #475569 !important; }
        body.dark-mode .kanban-col { background: #1E293B !important; border-color: #334155 !important; }
        body.dark-mode .task-card, body.dark-mode .chk-card, body.dark-mode .report-paper, body.dark-mode .archive-item, body.dark-mode .admin-section, body.dark-mode .login-box, body.dark-mode .modal-content { background: #1E293B !important; border-color: #334155 !important; }
        body.dark-mode .chk-item-row { background: #0F172A !important; border-color: #334155 !important; }
        body.dark-mode .chk-item-row:hover { background: #1E293B !important; }
        body.dark-mode .chk-memo { background: #1E293B !important; border-color: #475569 !important; }
        body.dark-mode .admin-table th { background: #0F172A !important; border-color: #334155 !important; }
        body.dark-mode .admin-table td { border-color: #334155 !important; }
        body.dark-mode .admin-table tr:hover td { background: #0F172A !important; }
        body.dark-mode .menu-chk-group label { background: #312E81 !important; }
        body.dark-mode .btn-toggle, body.dark-mode .btn-toggle-chk, body.dark-mode .task-category { background: transparent !important; border-color: #475569 !important; }
        body.dark-mode .duration-badge { border-color: #475569 !important; color: #94A3B8 !important; }
        body.dark-mode .btn-primary { background-color: #4F46E5 !important; }
        body.dark-mode .btn-primary:hover { background-color: #4338CA !important; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; font-family: var(--font-family); color: var(--color-text-main); background-color: var(--color-bg); letter-spacing: -0.01em; transition: background-color 0.3s, color 0.3s; scroll-behavior: smooth; }
        body { line-height: 1.6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: var(--border-radius-sm); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: var(--color-primary); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background-color: #3730A3; transform: translateY(-1px); }
        .btn-outline { background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text-main); }
        .btn-outline:hover { background-color: var(--color-bg); }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--color-text-sub); transition: color 0.2s; padding: 0.25rem; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { color: #EF4444; background: #FEE2E2; }
        
        textarea.input-text, textarea.inline-input { overflow-y: hidden; resize: none; box-sizing: border-box; font-family: inherit; line-height: 1.5; vertical-align: middle; word-break: keep-all; overflow-wrap: break-word; white-space: pre-wrap; width: 100%; }
        textarea.inline-input { min-height: 1.8rem; padding-top: 0.2rem; padding-bottom: 0.2rem; }
        .input-text { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); font-size: 0.95rem; font-family: inherit; transition: all 0.2s; background: var(--color-surface); color: var(--color-text-main); }
        .input-text:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
        select.input-text { cursor: pointer; }
        .inline-input, .inline-select { border: 1px solid transparent; background: transparent; font-family: inherit; padding: 0.3rem 0.4rem; border-radius: 4px; transition: all 0.2s; margin: -1px; color: var(--color-text-main); }
        .inline-input:hover { border-bottom: 1px dashed #94A3B8; }
        .inline-input:focus { outline: none; border: 1px solid var(--color-primary); background: var(--color-surface); box-shadow: 0 0 0 3px var(--color-primary-light); margin: -1px; }

        /* =========================================
           2. 레이아웃 & 모달
           ========================================= */
        #login-view { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--color-bg); }
        .login-box { background: var(--color-surface); padding: 2.5rem; border-radius: var(--border-radius); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; border: 1px solid var(--color-border); }
        .login-box h1 { font-size: 1.5rem; text-align: center; margin-bottom: 2rem; font-weight: 800; color: var(--color-primary); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--color-text-sub); }
        .login-options { display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 1.5rem; color: var(--color-text-sub); }

        #app-view { display: flex; height: 100vh; position: relative; }
        #sidebar { width: 260px; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 8px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 1.5rem; font-weight: 800; font-size: 1.2rem; color: var(--color-primary); display: flex; align-items: center; gap: 0.5rem; }
        .nav-menu { flex: 1; padding: 1rem 0.75rem; overflow-y: auto; }
        .nav-item { padding: 0.8rem 1rem; margin-bottom: 0.25rem; display: block; cursor: pointer; color: var(--color-text-sub); transition: all 0.2s; border-radius: var(--border-radius-sm); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: var(--color-primary-light); color: var(--color-primary); font-weight: 700; }
        .sidebar-footer { padding: 1.25rem; border-top: 1px solid var(--color-border); font-size: 0.875rem; background: var(--color-bg); }
        #main-content { flex: 1; padding: 2rem 2.5rem; overflow-y: auto; background-color: var(--color-bg); position: relative; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--color-surface); padding: 2rem; border-radius: var(--border-radius); width: 90%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid var(--color-border); }
        .modal-content.large { max-width: 850px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; }
        .modal-footer { margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .modal-footer.right { justify-content: flex-end; gap: 0.75rem; }

        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast { background: var(--color-primary); color: white; padding: 1rem 2rem; border-radius: 30px; font-weight: 700; font-size: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); animation: toastFadeIn 0.4s, toastFadeOut 0.4s 3s forwards; display: flex; align-items: center; gap: 0.5rem; }
        @keyframes toastFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastFadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

        #btn-stop-impersonation { position: fixed; bottom: 2.5rem; right: 2.5rem; z-index: 10000; background: #EF4444; color: white !important; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); padding: 1rem 1.5rem; font-size: 1rem; font-weight: 800; border-radius: 30px; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; border: none; transition: all 0.2s; }
        #btn-stop-impersonation:hover { background: #DC2626; transform: translateY(-3px); }

        /* =========================================
           3. 공통 모듈 (대시보드)
           ========================================= */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap:1rem; }
        .tabs { display: flex; gap: 1rem; border-bottom: 2px solid var(--color-border); margin-bottom: 2rem; }
        .tab-btn { background: none; border: none; padding: 0.5rem 0.5rem 1rem 0.5rem; font-size: 1.05rem; font-weight: 700; color: var(--color-text-sub); cursor: pointer; position: relative; transition: color 0.2s; }
        .tab-btn:hover { color: var(--color-text-main); }
        .tab-btn.active { color: var(--color-primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background-color: var(--color-primary); border-radius: 3px 3px 0 0; }

        .kanban-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
        .kanban-col { background: var(--color-surface); border-radius: var(--border-radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; min-height: 60vh; border: 1px solid var(--color-border); }
        .col-title { font-size: 1.05rem; font-weight: 800; padding-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; color: var(--color-text-main); }
        .task-list.grid-view { display: grid; grid-template-columns: repeat(2, 1fr); align-items: start; gap: 1.5rem; }
        
        .task-card, .chk-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); padding: 1rem; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; cursor: grab; }
        .task-card:hover, .chk-card:hover { box-shadow: var(--shadow-md); border-color: var(--color-primary-light); }
        .task-card:active, .chk-card:active { cursor: grabbing; }
        
        .drag-handle { color: var(--color-text-sub); font-size: 1.2rem; font-weight: bold; letter-spacing: -2px; padding-top: 0.3rem; opacity: 0.3; transition: opacity 0.2s; user-select: none; line-height: 1; cursor: grab; }
        .memo-drag-handle, .sub-drag-handle { font-size: 1.1rem; padding-top: 0.3rem; padding-left: 2px; padding-right: 2px; }
        .chk-item-row:hover > .drag-handle, .memo-row:hover .memo-drag-handle, .sub-item-row:hover .sub-drag-handle { opacity: 1; }
        
        .memo-row, .sub-item-row { border: 1px solid transparent; transition: background 0.2s, border 0.2s; border-radius: 4px; padding: 2px; }
        .memo-row:hover, .sub-item-row:hover { background: var(--color-bg); border-color: var(--color-border); }
        .memo-row:active, .sub-item-row:active { cursor: grabbing; }
        
        .card-dragging { opacity: 0.5; transform: scale(0.98); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); z-index: 100; border: 2px dashed var(--color-primary) !important; }
        .item-dragging { opacity: 0.4; background: var(--color-primary-light) !important; border: 2px dashed var(--color-primary) !important; }
        .memo-dragging { opacity: 0.4; background: var(--color-primary-light) !important; border: 1px dashed var(--color-primary) !important; }
        .card-dragging *, .item-dragging *, .memo-dragging * { pointer-events: none !important; }

        .task-header { display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; flex-wrap: nowrap; }
        .task-controls { display: flex; align-items: flex-start; gap: 0.5rem; flex-shrink: 0; margin-top: 0.1rem; white-space: nowrap; }
        .btn-toggle { flex-shrink: 0; background: transparent; border: 1px solid var(--color-border); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; color: var(--color-text-sub); display: flex; align-items: center; justify-content: center; margin-top: 0.1rem; }
        .task-category { width: 85px !important; min-width: 85px !important; text-align: center; font-weight: 700; font-size: 0.8rem; border-radius: 20px; flex-shrink: 0; margin-top: 0.1rem; }
        .task-title { flex: 1; min-width: 150px !important; font-weight: 800; font-size: 1.05rem; }
        .task-body { margin-top: 1rem; padding-left: 2.7rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .sub-items-list { display: flex; flex-direction: column; gap: 0.25rem; }
        .sub-item-row { display: flex; gap: 0.5rem; align-items: flex-start; width: 100%; }
        .sub-item-text { flex: 1; font-size: 0.9rem; min-width: 100px !important; }
        .btn-add-sub, .btn-add-remark { background: none; border: 1px dashed var(--color-border); color: var(--color-text-sub); border-radius: 4px; padding: 0.4rem; font-size: 0.8rem; cursor: pointer; transition: 0.2s; margin-top: 0.25rem; width: 100%; text-align: left; }
        .task-footer { display: flex; gap: 1.5rem; align-items: center; font-size: 0.8rem; color: var(--color-text-sub); margin-top: 0.5rem; padding-top: 0.75rem; border-top: 1px dashed var(--color-border); }
        .task-footer .inline-input { padding: 0.1rem 0.3rem; font-size: 0.85rem; width: 120px; font-weight: 600; }

        /* 🚨 업무 캘린더 전용 CSS */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--color-border); border: 1px solid var(--color-border); border-radius: var(--border-radius); overflow: hidden; margin-top: 1rem; }
        .cal-day-name { background: var(--color-primary-light); text-align: center; padding: 0.75rem 0.5rem; font-weight: 800; color: var(--color-text-main); font-size: 0.95rem; }
        .cal-cell { background: var(--color-surface); min-height: 130px; padding: 0.5rem; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; transition: background-color 0.2s; cursor: pointer; }
        .cal-cell:hover { background: var(--color-bg); }
        .cal-date { font-size: 0.9rem; font-weight: 700; color: var(--color-text-sub); margin-bottom: 6px; text-align: right; padding: 2px; user-select: none; }
        .cal-date.today { color: white; background: var(--color-primary); border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; align-self: flex-end; }
        .cal-task-badge { font-size: 0.8rem; padding: 0.3rem 0.5rem; border-radius: 4px; color: white; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; transition: transform 0.1s; }
        .cal-task-badge:hover { filter: brightness(0.9); transform: translateY(-1px); }
        .cal-task-badge:active { cursor: grabbing; }
        .cal-cell.other-month { background: var(--color-bg); opacity: 0.5; }
        
        #task-edit-modal .modal-content { max-width: 650px; background: var(--color-bg); padding: 1.5rem; border-radius: var(--border-radius); position: relative; }
        #btn-close-task-edit { position: absolute; top: -15px; right: -15px; background: #EF4444; color: white; border-radius: 50%; width: 36px; height: 36px; font-size: 1.2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 1050; display: flex; align-items: center; justify-content: center; border: 2px solid white; transition: 0.2s; cursor: pointer; }
        #btn-close-task-edit:hover { background: #DC2626; transform: scale(1.1); }
        #task-edit-modal .task-card { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid var(--color-border); background: var(--color-surface); margin-top: 0.5rem; }

        /* =========================================
           4. 보고서 레이아웃 (PDF 버그 완벽 방어)
           ========================================= */
        .report-header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 3px solid var(--color-text-main); }
        .report-title-main { font-size: 1.8rem; font-weight: 900; line-height: 1.3; white-space: pre-line; margin-bottom: 0.5rem; color: var(--color-text-main); letter-spacing: -0.02em; }
        .report-meta { font-size: 0.9rem; color: var(--color-text-sub); font-weight: 500; }
        .report-paper { background: var(--color-surface); padding: 3.5rem 3rem; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--color-border); max-width: 850px; margin: 0 auto; color: var(--color-text-main); }
        
        .group-category { margin-bottom: 3rem; } 
        .group-category-title { font-size: 1.25rem; font-weight: 800; color: var(--color-primary); padding-bottom: 0.5rem; border-bottom: 2px solid var(--color-border); margin-bottom: 1.5rem; letter-spacing: -0.01em; page-break-after: avoid; break-after: avoid; }
        
        .group-status { margin-bottom: 1.5rem; padding-left: 1.2rem; border-left: 3px solid var(--color-border); }
        .group-status.done { border-left-color: var(--status-done); }
        .group-status.ing { border-left-color: var(--status-ing); }
        .group-status-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: inline-block; padding: 0.3rem 0.8rem; border-radius: 6px; color: var(--color-text-main); } 
        .group-status-title.done { color: #064E3B; background: #D1FAE5; }
        .group-status-title.ing { color: #1E3A8A; background: #DBEAFE; }
        
        .report-task { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; margin-bottom: 0; padding: 1rem 0.5rem; border-bottom: 1px solid var(--color-bg); page-break-inside: avoid; break-inside: avoid; } 
        .report-task:last-child { border-bottom: none; }
        .report-task-content { flex: 1; min-width: 0; } 
        .report-task-title { font-weight: 700; font-size: 1.05rem; color: var(--color-text-main); margin-bottom: 0.4rem; display: block; line-height: 1.4; white-space: pre-wrap; word-break: break-word; } 
        .report-task-title::before { content: '▪ '; color: var(--color-border); font-size: 0.8rem; margin-top: 0.1rem; }
        
        .report-task-date { flex-shrink: 0; font-size: 0.85rem; color: var(--color-text-sub); text-align: right; min-width: 150px; line-height: 1.6; font-weight: 500; display: flex; flex-direction: column; align-items: flex-end; }
        .duration-badge { display: inline-block; border: 1px solid var(--color-border); color: var(--color-text-sub); background: transparent; padding: 0.1rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.75rem; margin-top: 4px; }
        .report-task-subs { padding-left: 1.2rem; font-size: 0.9rem; color: var(--color-text-sub); }
        .report-task-subs li { margin-bottom: 0.25rem; line-height: 1.5; list-style: none; white-space: pre-wrap; word-break: keep-all; }
        
        /* PDF 띄어쓰기 파괴 방어막 */
        .pdf-export-mode * { letter-spacing: 0px !important; word-spacing: 0px !important; }
        .pdf-export-mode .report-task { display: block !important; page-break-inside: avoid !important; break-inside: avoid !important; padding: 1.5rem 0.5rem; border-bottom: 1px solid #E2E8F0; }
        .pdf-export-mode .group-category { page-break-inside: avoid !important; break-inside: avoid !important; }
        .pdf-export-mode .report-task-content { float: left !important; width: 75% !important; }
        .pdf-export-mode .report-task-date { float: right !important; width: 25% !important; text-align: right !important; }
        .pdf-export-mode .report-task::after { content: ""; display: table; clear: both; }

        .archive-list { display: flex; flex-direction: column; gap: 1rem; max-width: 850px; margin: 0 auto; }
        .archive-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--border-radius); cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); }
        .archive-item:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .archive-title { font-weight: 800; font-size: 1.05rem; color: var(--color-text-main); margin-bottom: 0.2rem; }
        .archive-date { font-size: 0.8rem; color: var(--color-text-sub); }

        /* =========================================
           5. 체크리스트 전용 CSS
           ========================================= */
        .checklist-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
        @media (max-width: 1200px) { .checklist-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 800px) { .checklist-grid { grid-template-columns: 1fr; } }
        
        .chk-card { display: flex; flex-direction: column; max-height: 60vh; }

        .menu-chk-group label { display: flex; align-items: center; gap: 0.2rem; font-size: 0.85rem; background: var(--color-primary-light); padding: 0.2rem 0.5rem; border-radius: 4px; color: var(--color-primary); }

</head>
<body>

    <!-- 로그인 및 공용 팝업들 -->
    <div id="signup-modal" class="modal-overlay hidden">

            <div class="modal-footer right"><button class="btn btn-outline" id="btn-close-pw-modal">취소</button><button class="btn btn-primary" id="btn-save-pw">변경 사항 저장</button></div>

    <div id="report-modal" class="modal-overlay hidden">

            <div style="text-align: right; margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-primary" id="btn-save-pdf">📄 PDF 저장</button>

    <!-- 로그인 뷰 -->
    <div id="login-view">
        <div class="login-box">
            <h1 id="login-sys-title">데이터베이스 연결 중... ⏳</h1>
            <form id="login-form">
                <div class="form-group"><label>아이디</label><input type="text" id="user-id" class="input-text" required spellcheck="false"></div>

    <button id="btn-stop-impersonation" class="hidden">🔙 관리자로 돌아가기</button>

    <!-- 메인 앱 뷰 -->
    <div id="app-view" class="hidden">
        <aside id="sidebar">
            <div class="sidebar-header" id="sidebar-title"><span style="font-size: 1.4rem;">💡</span> 시스템 이름</div>
            <ul class="nav-menu">
                <li class="nav-item active" data-target="dashboard">📊 <span id="menu-name-dashboard">업무 대시보드</span></li>
                <li class="nav-item" data-target="calendar">📆 <span id="menu-name-calendar">업무 캘린더</span></li>
                <li class="nav-item" data-target="report">📝 <span id="menu-name-report">업무 보고서</span></li>
                <li class="nav-item" data-target="checklist">✅ <span id="menu-name-checklist">업무 체크리스트</span></li>
                <li class="nav-item" data-target="monthly">🗓️ <span id="menu-name-monthly">매월 체크리스트</span></li>
                <li class="nav-item hidden" data-target="admin" id="nav-admin">⚙️ <span id="menu-name-admin">설정</span></li>
            </ul>
            <div class="sidebar-footer">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
                    <div id="user-info" style="font-weight: 700; color: var(--color-text-main); font-size:0.9rem;"></div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-icon" id="btn-change-pw-self" title="내 비밀번호 변경">🔑</button>
                        <button class="btn-icon" id="btn-toggle-dark" title="다크/라이트 모드 변경">🌙</button>
                    </div>
                </div>
                <button id="btn-logout" class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.6rem;">로그아웃</button>
            </div>
        </aside>
        <main id="main-content"><div id="content-area"></div></main>
    </div>
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAl6OzWJYAXoPBN7qAhMrwGFnesxjJ1V0",
            authDomain: "quickwork-c073d.firebaseapp.com",
            projectId: "quickwork-c073d",
            storageBucket: "quickwork-c073d.firebasestorage.app",
            messagingSenderId: "814147288024",
            appId: "1:814147288024:web:12e64c049dc6774b3810ad"
        };

        const app = initializeApp(firebaseConfig);
        const firestoreDB = getFirestore(app);

        const DB_KEY = 'AppDB';
        const defaultDB = {
            users: [{ id: 'admin', pw: '1111', role: 'admin', status: 'approved', name: '최고관리자', group: '운영팀', menus: ['dashboard','calendar','report','checklist','monthly','admin'] }],
            groups: [{ id: 1, name: '운영팀' }, { id: 2, name: '개발팀' }, { id: 3, name: '영업팀' }],
            settings: { sysTitle: 'QuickWork', menuNames: { dashboard: '업무 대시보드', calendar: '업무 캘린더', report: '업무 보고서', checklist: '업무 체크리스트', monthly: '매월 체크리스트', admin: '설정' }, notice: '새로운 업무 시스템에 오신 것을 환영합니다!' }
        };
        
        let globalDB = null; 
        let globalTasks = []; 
        let globalChecklists = [];
        let globalMonthlyChecklists = [];
        let globalReports = [];
        let globalReportRemarks = {};
        let isDBConnected = false; 

        function getDB() { return globalDB; }

        async function saveDB(data) { 
            if (!isDBConnected) return; 
            globalDB = data;
            try { await setDoc(doc(firestoreDB, "WorkSystem", DB_KEY), globalDB); } 
            catch (e) { console.error("데이터 저장 오류:", e); }
        }

        function triggerRefreshIfActive(targetMenu) {
            const activeNav = document.querySelector('.nav-item.active');
            if (!activeNav) return;
            
            if (activeNav.dataset.target === targetMenu) {
                if (window.isDragging) {
                    window.pendingRealtimeUpdate = true;
                    return;
                }

                const el = document.activeElement;
                const activeTag = el ? el.tagName : '';
                const isTextInput = activeTag === 'TEXTAREA' || 
                                    (activeTag === 'INPUT' && ['text', 'date', 'month', 'password', 'search'].includes(el.type));
                const isHidden = el && el.closest('.hidden') !== null;

                if (isTextInput && !isHidden) {
                    window.pendingRealtimeUpdate = true;
                    if(!window.toastTimeout) {
                        showToast("💡 실시간 업데이트 대기 중... (입력 완료 후 바탕 클릭 시 반영)");
                        window.toastTimeout = setTimeout(()=> { window.toastTimeout = null; }, 3000);
                    }
                } else {
                    refreshCurrentView(targetMenu);
                }
            }
        }

        /* 🚨 무적 렌더링 방어막 1: 화면 렌더러 보호 */
        function refreshCurrentView(target) {
            try {
                if (target === 'dashboard') renderDashList();
                else if (target === 'calendar') renderCalendar();
                else if (target === 'report') { if (reportState.tab === 'archive') renderArchive(document.getElementById('report-content-area')); else renderReportContent(); }
                else if (target === 'checklist') renderChecklist();
                else if (target === 'monthly') renderMonthlyChecklist();
                else if (target === 'admin') initAdmin(document.getElementById('content-area'));
            } catch(e) {
                console.error("View Refresh Error:", e);
            }
        }

        async function initDB() { 
            try {
                const docRef = doc(firestoreDB, "WorkSystem", DB_KEY);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    globalDB = docSnap.data(); 
                    isDBConnected = true; 
                    
                    let needsAppDBSave = false;

                    // 🚨 데이터 분가 (Null 데이터 100% 무시 로직 적용)
                    if (globalDB.tasks && globalDB.tasks.length > 0) {
                        for (let i=0; i<globalDB.tasks.length; i++) { 
                            const t = globalDB.tasks[i]; 
                            if (t && t.id) { t.order = i; await setDoc(doc(firestoreDB, "tasks", String(t.id)), t); }
                        }
                        globalDB.tasks = []; needsAppDBSave = true;
                    }
                    if (globalDB.checklists && globalDB.checklists.length > 0) {
                        for (let i=0; i<globalDB.checklists.length; i++) { 
                            const c = globalDB.checklists[i]; 
                            if (c && c.id) { c.order = i; await setDoc(doc(firestoreDB, "checklists", String(c.id)), c); }
                        }
                        globalDB.checklists = []; needsAppDBSave = true;
                    }
                    if (globalDB.monthlyChecklists && globalDB.monthlyChecklists.length > 0) {
                        for (let i=0; i<globalDB.monthlyChecklists.length; i++) { 
                            const c = globalDB.monthlyChecklists[i]; 
                            if (c && c.id) { c.order = i; await setDoc(doc(firestoreDB, "monthlyChecklists", String(c.id)), c); }
                        }
                        globalDB.monthlyChecklists = []; needsAppDBSave = true;
                    }
                    if (globalDB.reports && globalDB.reports.length > 0) {
                        for (let i=0; i<globalDB.reports.length; i++) { 
                            const r = globalDB.reports[i]; 
                            if (r && r.id) { await setDoc(doc(firestoreDB, "reports", String(r.id)), r); }
                        }
                        globalDB.reports = []; needsAppDBSave = true;
                    }
                    if (globalDB.reportRemarks && Object.keys(globalDB.reportRemarks).length > 0) {
                        for (let [key, arr] of Object.entries(globalDB.reportRemarks)) { 
                            if (key && arr) { await setDoc(doc(firestoreDB, "reportRemarks", key), { remarks: arr }); }
                        }
                        globalDB.reportRemarks = {}; needsAppDBSave = true;
                    }
                    
                    if (!globalDB.users || globalDB.users.length === 0) { globalDB.users = JSON.parse(JSON.stringify(defaultDB.users)); needsAppDBSave = true; }
                    if (!globalDB.settings) { globalDB.settings = JSON.parse(JSON.stringify(defaultDB.settings)); needsAppDBSave = true; }
                    if (!globalDB.settings.menuNames) { globalDB.settings.menuNames = JSON.parse(JSON.stringify(defaultDB.settings.menuNames)); needsAppDBSave = true; }
                    if (!globalDB.settings.menuNames.calendar) { globalDB.settings.menuNames.calendar = '업무 캘린더'; needsAppDBSave = true; }
                    
                    if (!globalDB.monthlyChecklistInit) { globalDB.monthlyChecklistInit = {}; needsAppDBSave = true; }
                    if (!globalDB.groups) { globalDB.groups = defaultDB.groups; needsAppDBSave = true; }
                    
                    (globalDB.users || []).forEach(u => {
                        if (!u) return; // 🚨 비어있는 유저 데이터 무시 (로그인 불가 원인 차단)
                        if (!u.menus) { u.menus = ['dashboard', 'calendar', 'report', 'checklist', 'monthly']; needsAppDBSave = true; }
                        if (!u.menus.includes('calendar')) { u.menus.splice(1, 0, 'calendar'); needsAppDBSave = true; }
                        if (!u.menus.includes('monthly')) { u.menus.push('monthly'); needsAppDBSave = true; }
                        if (u.role === 'admin' && !u.menus.includes('admin')) { u.menus.push('admin'); needsAppDBSave = true; }
                        if (!u.group) { u.group = '운영팀'; needsAppDBSave = true; }
                    });

                    if (needsAppDBSave) await saveDB(globalDB);

                } else {
                    globalDB = JSON.parse(JSON.stringify(defaultDB));
                    globalDB.monthlyChecklistInit = {};
                    isDBConnected = true; 
                    await saveDB(globalDB);
                }

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if(globalDB) {
                            globalDB.users = data.users || defaultDB.users;
                            globalDB.settings = data.settings || defaultDB.settings;
                            globalDB.groups = data.groups || defaultDB.groups;
                            globalDB.monthlyChecklistInit = data.monthlyChecklistInit || {};
                            triggerRefreshIfActive('admin');
                        }
                    }
                });

                onSnapshot(collection(firestoreDB, "tasks"), (snapshot) => {
                    globalTasks = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data) return null;
                        if(!data.subItems) data.subItems = [];
                        return data;
                    }).filter(x => x).sort((a, b) => (a.order || 0) - (b.order || 0));
                    
                    triggerRefreshIfActive('dashboard');
                    triggerRefreshIfActive('calendar'); 
                    
                    const editModalBody = document.getElementById('task-edit-modal-body');
                    const modal = document.getElementById('task-edit-modal');
                    if (editModalBody && modal && !modal.classList.contains('hidden')) {
                        const card = editModalBody.querySelector('.task-card');
                        if (card) {
                            const taskId = Number(card.dataset.id);
                            const updatedT = globalTasks.find(x => x && x.id === taskId);
                            if (updatedT) editModalBody.innerHTML = createCardHTML({...updatedT, isOpen: true});
                            else modal.classList.add('hidden'); 
                        }
                    }
                });

                onSnapshot(collection(firestoreDB, "checklists"), (snapshot) => {
                    globalChecklists = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data) return null;
                        if(!data.items) data.items = [];
                        return data;
                    }).filter(x => x).sort((a, b) => {
                        if(a.order !== undefined && b.order !== undefined) return a.order - b.order;
                        return b.id - a.id;
                    });
                    triggerRefreshIfActive('checklist');
                });

                onSnapshot(collection(firestoreDB, "monthlyChecklists"), (snapshot) => {
                    globalMonthlyChecklists = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data) return null;
                        if(!data.items) data.items = [];
                        return data;
                    }).filter(x => x).sort((a, b) => {
                        if(a.order !== undefined && b.order !== undefined) return a.order - b.order;
                        return b.id - a.id;
                    });

        function toLocalISOString(dateObj) { const tz = dateObj.getTimezoneOffset() * 60000; return (new Date(dateObj.getTime() - tz)).toISOString().split('T')[0]; }
        function getTodayString() { return toLocalISOString(new Date()); }

        function getDaysDiff(startStr, endStr) { if (!startStr || !endStr) return 0; let s = new Date(startStr); let e = new Date(endStr); if(isNaN(s.getTime())||isNaN(e.getTime())) return 0; return Math.floor((e - s) / (1000 * 60 * 60 * 24)) + 1; }
        function getWeekInfo(dateStr) { let date = dateStr ? new Date(dateStr) : new Date(); if(isNaN(date.getTime())) date = new Date(); const year = date.getFullYear(), month = date.getMonth() + 1, firstDay = new Date(year, month - 1, 1).getDay(); return { year, month, week: Math.ceil((date.getDate() + firstDay) / 7) }; }
        function getCurrentMondayStr() { const today = new Date(), day = today.getDay(), diff = today.getDate() - day + (day === 0 ? -6 : 1); return toLocalISOString(new Date(today.setDate(diff))); }

        /* 🚨 미래 월 자동 생성 엔진 (무결성 및 Crash 방어막 탑재) */
        function getMonthDiff(m1, m2) {
            const [y1, mo1] = m1.split('-').map(Number);
            const [y2, mo2] = m2.split('-').map(Number);
            return (y2 - y1) * 12 + (mo2 - mo1);
        }

        async function ensureMonthInitialized(db, uid, targetMonth) {
            try {
                if(!db) return;
                const initKey = `${uid}_${targetMonth}`;
                let initMap = db.monthlyChecklistInit || {};
                
                if (initMap[initKey]) return;

                const initKeys = Object.keys(initMap)
                                       .filter(k => k.startsWith(`${uid}_`))
                                       .map(k => k.replace(`${uid}_`, ''))
                                       .sort();
                
                let lastInitMonth = null;
                for (let i = initKeys.length - 1; i >= 0; i--) {
                    if (initKeys[i] < targetMonth) {
                        lastInitMonth = initKeys[i];
                        break;
                    }
                }

                if (!lastInitMonth) {
                    initMap[initKey] = true;
                    db.monthlyChecklistInit = initMap;
                    await updateDoc(doc(firestoreDB, "WorkSystem", DB_KEY), { monthlyChecklistInit: initMap });
                    return;
                }

                let curr = lastInitMonth;
                while (curr < targetMonth) {
                    const nextMonth = getNextMonthStr(curr);
                    const prevRecords = (globalMonthlyChecklists || []).filter(c => c && c.userId === uid && c.month === curr);
                    
                    if (prevRecords.length > 0) {
                        for (let group of prevRecords) {
                            let newItems = [];
                            (group.items||[]).forEach(item => {
                                if (!item) return;
                                if (item.status === '당월') return; 
                                let newItem = { ...item, id: Date.now() + Math.random(), syncItemId: item.syncItemId || item.id, isChecked: false };
                                if (item.status === '이월') newItem.status = '당월';
                                newItem.memos = Array.isArray(item.memos) ? [...item.memos] : []; 
                                newItems.push(newItem);
                            });
                            
                            const newGroup = {
                                ...group,
                                id: Date.now() + Math.random(),
                                syncGroupId: group.syncGroupId || group.id, 
                                month: nextMonth,
                                items: newItems,
                                order: group.order || -Date.now()
                            };
                            await setDoc(doc(firestoreDB, "monthlyChecklists", String(newGroup.id)), newGroup);
                        }
                    }
                    
                    initMap[`${uid}_${nextMonth}`] = true;
                    curr = nextMonth;
                }
                db.monthlyChecklistInit = initMap;
                await updateDoc(doc(firestoreDB, "WorkSystem", DB_KEY), { monthlyChecklistInit: initMap });
            } catch (e) {
                console.error("Month Initialization Error:", e);
            }
        }

        function getInitializedFutureMonths(db, uid, currentMonth) {

        async function syncFutureItemAdd(uid, currentMonth, syncGroupId, item) {
            try {
                if (item.status === '당월') return;
                const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
                for(let m of futureMonths) {
                    const targetGroup = (globalMonthlyChecklists||[]).find(c => c && c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                    if (targetGroup) {

                        else if (item.status === '이월' && monthDiff === 1) { let newItem = { ...item, id: Date.now() + Math.random(), isChecked: false, status: '당월' }; targetGroup.items.push(newItem); }
                        await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });
                    }
                }
            } catch(e) { console.error("Sync Error:", e); }
        }

        async function syncFutureItemDelete(uid, currentMonth, syncItemId) {

                for(let m of futureMonths) {
                    const targetGroup = (globalMonthlyChecklists||[]).find(c => c && c.userId === uid && c.month === m && (c.items||[]).some(i => i && i.syncItemId === syncItemId));
                    if (targetGroup) {

                        await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });

        }

        async function syncFutureItemEdit(uid, currentMonth, syncGroupId, editedItem) {
            try {
                const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
                for(let m of futureMonths) {
                    const targetGroup = (globalMonthlyChecklists||[]).find(c => c && c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                    if (targetGroup) {
                        const targetIdx = (targetGroup.items||[]).findIndex(i => i && i.syncItemId === editedItem.syncItemId);
                        const monthDiff = getMonthDiff(currentMonth, m);
                        
                        let shouldExist = false; let futureStatus = '';
                        if (editedItem.status === '고정') { shouldExist = true; futureStatus = '고정'; } 
                        else if (editedItem.status === '이월' && monthDiff === 1) { shouldExist = true; futureStatus = '당월'; }
                        
                        if (!shouldExist) {
                            if (targetIdx !== -1) targetGroup.items.splice(targetIdx, 1);
                        } else {
                            if (targetIdx !== -1) {
                                targetGroup.items[targetIdx].text = editedItem.text;
                                targetGroup.items[targetIdx].memos = Array.isArray(editedItem.memos) ? [...editedItem.memos] : [];
                                targetGroup.items[targetIdx].status = futureStatus;
                                targetGroup.items[targetIdx].isMemoOpen = editedItem.isMemoOpen;
                            } else {
                                let newItem = { ...editedItem, id: Date.now() + Math.random(), isChecked: false, status: futureStatus };
                                targetGroup.items.push(newItem);
                            }
                        }
                        await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });
                    }
                }
            } catch(e) { console.error("Sync Error:", e); }
        }

        function handleAutoScroll(e) {
            const margin = 60; let target = document.getElementById('main-content');
            if ((dragType === 'item' || dragType === 'memo' || dragType === 'subItem') && draggedItem) { const body = draggedItem.closest('.chk-body') || draggedItem.closest('.task-body'); if (body) target = body; }
            const rect = target.getBoundingClientRect();
            if (e.clientY < rect.top + margin) startAutoScroll(target, -1); else if (e.clientY > rect.bottom - margin) startAutoScroll(target, 1); else stopAutoScroll();
        }

        document.addEventListener('dragstart', (e) => {
            if (e.target.classList) {
                window.isDragging = true;
                if (e.target.classList.contains('chk-item-row')) { draggedItem = e.target; dragType = 'item'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('item-dragging'), 0); } 
                else if (e.target.classList.contains('chk-card') || e.target.classList.contains('task-card')) { draggedItem = e.target; dragType = 'card'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('card-dragging'), 0); }
                else if (e.target.classList.contains('memo-row')) { draggedItem = e.target; dragType = 'memo'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('memo-dragging'), 0); }
                else if (e.target.classList.contains('sub-item-row')) { draggedItem = e.target; dragType = 'subItem'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('memo-dragging'), 0); }
                else if (e.target.classList.contains('cal-task-badge')) { draggedItem = e.target; dragType = 'cal-badge'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('item-dragging'), 0); }
            }
        });
        
        document.addEventListener('dragover', (e) => {
            if (!draggedItem) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; handleAutoScroll(e);
            
            if (dragType === 'item') {
                const row = e.target.closest('.chk-item-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            } else if (dragType === 'card') {
                const cardClass = draggedItem.classList.contains('chk-card') ? '.chk-card' : '.task-card'; const card = e.target.closest(cardClass);
                if (card && card !== draggedItem && card.parentNode === draggedItem.parentNode) {
                    const bounding = card.getBoundingClientRect(); const isAfter = (e.clientX - bounding.x > bounding.width / 2) || (e.clientY - bounding.y > bounding.height / 2);
                    if (isAfter) card.after(draggedItem); else card.before(draggedItem);
                }
            } else if (dragType === 'memo') {
                const row = e.target.closest('.memo-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            } else if (dragType === 'subItem') {
                const row = e.target.closest('.sub-item-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            }
            else if (dragType === 'cal-badge') {
                const badge = e.target.closest('.cal-task-badge');
                const cell = e.target.closest('.cal-cell');
                if (badge && badge !== draggedItem && badge.parentNode === draggedItem.parentNode) {
                    const bounding = badge.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) badge.after(draggedItem); else badge.before(draggedItem);
                } else if (cell && cell !== draggedItem.parentNode && !e.target.closest('.cal-task-badge')) {
                    cell.appendChild(draggedItem);
                }
            }
        });
        
        document.addEventListener('drop', async (e) => {
            if (!draggedItem) return; e.preventDefault(); stopAutoScroll();
            
            try {
                if (dragType === 'item') {
                    const chkCard = draggedItem.closest('.chk-card');
                    if(chkCard) {
                        const isMonthly = chkCard.dataset.isMonthly === 'true';
                        const listId = Number(chkCard.dataset.chkId);
                        const list = isMonthly ? (globalMonthlyChecklists||[]).find(c => c && c.id === listId) : (globalChecklists||[]).find(c => c && c.id === listId);
                        if(list) {
                            const currentItemNodes = Array.from(chkCard.querySelectorAll('.chk-item-row'));
                            const sortedIds = currentItemNodes.map(node => Number(node.dataset.itemId));
                            list.items.sort((a, b) => sortedIds.indexOf(a.id) - sortedIds.indexOf(b.id));
                            await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { items: list.items });
                        }
                    }
                } else if (dragType === 'card') {
                    const wrapClass = draggedItem.classList.contains('chk-card') ? '.chk-list-wrap' : '.task-list-wrap';
                    const cardClass = draggedItem.classList.contains('chk-card') ? '.chk-card' : '.task-card';
                    const containerWrap = draggedItem.closest(wrapClass);
                    
                    if(containerWrap) {
                        const currentCardNodes = Array.from(containerWrap.querySelectorAll(cardClass));
                        const sortedIds = currentCardNodes.map(node => Number(node.dataset.id || node.dataset.chkId));
                        
                        if (draggedItem.classList.contains('chk-card')) {
                            const isMonthly = draggedItem.dataset.isMonthly === 'true';
                            for (let i=0; i<sortedIds.length; i++) {
                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(sortedIds[i])), { order: i }); 
                            }
                        } else {
                            const uid = getCurrentUserId(); 
                            const kanbanCol = draggedItem.closest('.kanban-col');
                            const columnStatus = kanbanCol ? kanbanCol.dataset.status : '완료';
                            const taskId = Number(draggedItem.dataset.id);
                            
                            const taskToUpdate = (globalTasks||[]).find(t => t && t.id === taskId);
                            if (taskToUpdate && taskToUpdate.status !== columnStatus) {
                                const today = getTodayString();
                                let updatePayload = { status: columnStatus };
                                if ((columnStatus === '진행중' || columnStatus === '보류') && !taskToUpdate.startDate) updatePayload.startDate = today;
                                if (columnStatus === '완료') {
                                    if (!taskToUpdate.endDate) updatePayload.endDate = today;
                                    if (!taskToUpdate.startDate) updatePayload.startDate = today;
                                }
                                await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);
                            }

                            for (let i = 0; i < sortedIds.length; i++) {
                                await updateDoc(doc(firestoreDB, "tasks", String(sortedIds[i])), { order: i });
                            }
                        }
                    }
                } else if (dragType === 'memo') {
                    const chkCard = draggedItem.closest('.chk-card');
                    const itemRow = draggedItem.closest('.chk-item-row');
                    if(chkCard && itemRow) {
                        const isMonthly = chkCard.dataset.isMonthly === 'true';
                        const listId = Number(chkCard.dataset.chkId);
                        const itemId = Number(itemRow.dataset.itemId);
                        const list = isMonthly ? (globalMonthlyChecklists||[]).find(c => c && c.id === listId) : (globalChecklists||[]).find(c => c && c.id === listId);
                        if(list) {
                            const item = (list.items||[]).find(i => i && i.id === itemId);
                            if(item) {
                                const currentMemoNodes = Array.from(itemRow.querySelectorAll('.chk-memo'));
                                item.memos = currentMemoNodes.map(node => node.value);

                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { items: list.items });
                                if (isMonthly) {
                                    const uid = getCurrentUserId();
                                    syncFutureItemEdit(uid, monthlyChkState.month, list.syncGroupId||list.id, item);
                                }
                            }
                        }
                    }
                } else if (dragType === 'subItem') {
                    const taskCard = draggedItem.closest('.task-card');
                    if(taskCard) {
                        const taskId = Number(taskCard.dataset.id);
                        const task = (globalTasks||[]).find(t => t && t.id === taskId);
                        if(task) {
                            const currentSubNodes = Array.from(taskCard.querySelectorAll('.sub-item-row'));
                            const sortedIds = currentSubNodes.map(node => Number(node.dataset.subId));
                            
                            const newSubItems = [...(task.subItems||[])];
                            newSubItems.sort((a, b) => sortedIds.indexOf(a.id) - sortedIds.indexOf(b.id));
                            
                            await updateDoc(doc(firestoreDB, "tasks", String(taskId)), { subItems: newSubItems });
                        }
                    }
                }
                else if (dragType === 'cal-badge') {
                    const cell = draggedItem.closest('.cal-cell');
                    if (cell) {
                        const dateStr = cell.dataset.date;
                        const taskId = Number(draggedItem.dataset.taskId);
                        const taskToUpdate = (globalTasks||[]).find(t => t && t.id === taskId);

                        if (taskToUpdate && dateStr) {
                            let updatePayload = {};
                            let isDateChanged = false;

                            if (taskToUpdate.status === '완료') {
                                if (taskToUpdate.endDate !== dateStr) { updatePayload.endDate = dateStr; isDateChanged = true; }
                            } else {
                                if (taskToUpdate.startDate !== dateStr) { updatePayload.startDate = dateStr; isDateChanged = true; }
                            }

                            if (isDateChanged) await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);

                            const currentNodes = Array.from(cell.querySelectorAll('.cal-task-badge'));
                            for (let i = 0; i < currentNodes.length; i++) {
                                const id = Number(currentNodes[i].dataset.taskId);
                                await updateDoc(doc(firestoreDB, "tasks", String(id)), { order: i });
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Drop Event Error:", err);
            }
            
            draggedItem.classList.remove('item-dragging', 'card-dragging', 'memo-dragging'); draggedItem = null; dragType = null;
            window.isDragging = false;
        });
        document.addEventListener('dragend', (e) => { 
            if (draggedItem) draggedItem.classList.remove('item-dragging', 'card-dragging', 'memo-dragging'); 
            draggedItem = null; dragType = null; stopAutoScroll(); 
            window.isDragging = false;
        });

        /* -----------------------------------------
           통합 이벤트 위임 (Input & 실시간 변경)
           ----------------------------------------- */
        document.body.addEventListener('input', (e) => { 
            try {
                const target = e.target;
                if (target.tagName === 'TEXTAREA') autoResizeTextarea(target);
                if (target.id === 'dash-search') { dashState.search = e.target.value; renderDashList(); } 
                if (target.id === 'chk-search') { chkState.search = e.target.value; renderChecklist(); }
                
                const chkCard = target.closest('.chk-card');
                if (chkCard) {
                    const isMonthly = chkCard.dataset.isMonthly === 'true';
                    const list = isMonthly ? (globalMonthlyChecklists||[]).find(c => c && c.id === Number(chkCard.dataset.chkId)) : (globalChecklists||[]).find(c => c && c.id === Number(chkCard.dataset.chkId));
                    if (list) {
                        if (target.classList.contains('chk-title')) list.title = target.value;
                        else if (target.closest('.chk-item-row')) {
                            const row = target.closest('.chk-item-row');
                            const item = (list.items||[]).find(i => i && i.id === Number(row.dataset.itemId));
                            if (item) {
                                if (target.classList.contains('chk-text')) item.text = target.value;
                                if (target.classList.contains('chk-memo')) { const idx = Number(target.dataset.idx); item.memos[idx] = target.value; }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Input Event Error:", err);
            }
        });

        document.body.addEventListener('focusout', async (e) => {
            try {
                const target = e.target;
                const taskCard = target.closest('.task-card');
                if (taskCard) {
                    const taskId = taskCard.dataset.id;
                    const t = (globalTasks||[]).find(x => x && x.id === Number(taskId));
                    if(t) {
                        let updatePayload = {};
                        let shouldUpdate = false;
                        
                        if(target.classList.contains('task-category') && t.category !== target.value) { updatePayload.category = target.value; shouldUpdate = true; }
                        if(target.classList.contains('task-title') && t.title !== target.value) { updatePayload.title = target.value; shouldUpdate = true; }
                        if(target.classList.contains('task-start') && t.startDate !== target.value) { updatePayload.startDate = target.value; shouldUpdate = true; }
                        if(target.classList.contains('task-end') && t.endDate !== target.value) { updatePayload.endDate = target.value; shouldUpdate = true; }
                        
                        if(target.classList.contains('sub-item-text')) {
                            const row = target.closest('.sub-item-row');
                            if(row) {
                                const subId = Number(row.dataset.subId);
                                const s = (t.subItems||[]).find(x => x && x.id === subId);
                                if(s && s.text !== target.value) {
                                    s.text = target.value;
                                    updatePayload.subItems = t.subItems;
                                    shouldUpdate = true;
                                }
                            }
                        }
                        if(shouldUpdate) await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);
                    }
                }

                if (target.classList.contains('chk-title') || target.classList.contains('chk-text') || target.classList.contains('chk-memo')) {
                    const uid = getCurrentUserId(), chkCard = target.closest('.chk-card');
                    if (chkCard) {
                        const isMonthly = chkCard.dataset.isMonthly === 'true';
                        const list = isMonthly ? (globalMonthlyChecklists||[]).find(c => c && c.id === Number(chkCard.dataset.chkId)) : (globalChecklists||[]).find(c => c && c.id === Number(chkCard.dataset.chkId));
                        if (list) {
                            if (target.classList.contains('chk-title')) {
                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { title: list.title });
                                if(isMonthly) syncFutureGroupTitle(uid, monthlyChkState.month, list.syncGroupId||list.id, list.title);
                            } else if (target.closest('.chk-item-row')) {
                                const row = target.closest('.chk-item-row');
                                const item = (list.items||[]).find(i => i && i.id === Number(row.dataset.itemId));
                                if (item) {
                                    await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { items: list.items });
                                    if(isMonthly) syncFutureItemEdit(uid, monthlyChkState.month, list.syncGroupId||list.id, item);
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Focusout Event Error:", err);
            }
        });

        document.body.addEventListener('change', async (e) => {
            try {
                const target = e.target; 
                
                if (target.id === 'backup-file-input') {
                    const file = target.files[0];
                    if (!file) return;

                    if (!confirm("🚨 [경고] 복원을 진행하면 현재 시스템의 모든 데이터가 업로드한 파일의 내용으로 완전히 덮어씌워집니다.\n\n정말 시스템을 복원하시겠습니까?")) {
                        target.value = ''; return;
                    }

                    const reader = new FileReader();
                    reader.onload = async function(event) {
                        try {
                            const parsedData = JSON.parse(event.target.result);
                            if (!parsedData.users || !parsedData.settings) throw new Error("올바른 QuickWork 백업 파일 형식이 아닙니다.");
                            
                            isDBConnected = true; 
                            
                            if (parsedData.tasks) for (let t of parsedData.tasks) await setDoc(doc(firestoreDB, "tasks", String(t.id)), t);
                            if (parsedData.checklists) for (let t of parsedData.checklists) await setDoc(doc(firestoreDB, "checklists", String(t.id)), t);
                            if (parsedData.monthlyChecklists) for (let t of parsedData.monthlyChecklists) await setDoc(doc(firestoreDB, "monthlyChecklists", String(t.id)), t);
                            if (parsedData.reports) for (let t of parsedData.reports) await setDoc(doc(firestoreDB, "reports", String(t.id)), t);
                            if (parsedData.reportRemarks) {
                                for (let [key, arr] of Object.entries(parsedData.reportRemarks)) await setDoc(doc(firestoreDB, "reportRemarks", key), { remarks: arr });
                            }
                            
                            parsedData.tasks = []; parsedData.checklists = []; parsedData.monthlyChecklists = []; parsedData.reports = []; parsedData.reportRemarks = {};
                            parsedData.lastSyncTime = Date.now();
                            await setDoc(doc(firestoreDB, "WorkSystem", DB_KEY), parsedData);
                            
                            alert("✅ 데이터 복원이 성공적으로 완료되었습니다.\n시스템을 다시 시작합니다.");
                            location.reload(); 
                        } catch (error) {
                            alert("파일을 읽는 중 오류가 발생했습니다: " + error.message);
                        }
                        target.value = ''; 
                    };
                    reader.readAsText(file);
                    return;
                }
                
                const c=target.closest('.task-card'); 
                if(c && target.classList.contains('task-status')){
                    const taskId = Number(c.dataset.id);
                    const t = (globalTasks||[]).find(x => x && x.id === taskId);
                    
                    if(t){
                        const n=target.value, today=getTodayString();
                        
                        if(n === '완료') {
                            target.value = t.status; 
                            document.getElementById('complete-task-date').value = t.endDate || today;
                            document.getElementById('task-complete-modal').dataset.taskId = t.id;
                            document.getElementById('task-complete-modal').classList.remove('hidden');
                            return;
                        }
                        
                        let updatePayload = { status: n };
                        if((n === '진행중' || n === '보류') && !t.startDate) updatePayload.startDate = today;
                        await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);
                        
                        if(c.closest('#task-edit-modal-body')) {
                            document.getElementById('task-edit-modal').classList.add('hidden');
                        }
                        return;
                    }
                }
                
                if(target.id==='select-weekly'){reportState.selectedWeek=target.value;renderReportContent();} if(target.id==='select-monthly'){reportState.selectedMonth=target.value;renderReportContent();}
                if(target.classList.contains('remark-text')){
                    const list = target.closest('.report-remarks-list');
                    const row = target.closest('.sub-item-row');
                    if(list && row) {
                        const rKey = list.dataset.remarkKey;
                        const arr = globalReportRemarks[rKey] || [];
                        const r=arr.find(x=>x && x.id===Number(row.dataset.subId));
                        if(r){
                            r.text=target.value;
                            target.setAttribute('value',target.value);
                            await setDoc(doc(firestoreDB, "reportRemarks", rKey), { remarks: arr });
                        }
                    }
                }
                
                if (target.id === 'monthly-month-select') { monthlyChkState.month = target.value; renderMonthlyChecklist(); }

                const chk=target.closest('.chk-card'); 
                if(chk){
                    const isMonthly = chk.dataset.isMonthly === 'true';
                    const uid = getCurrentUserId();
                    const l = isMonthly ? (globalMonthlyChecklists||[]).find(x=>x && x.id===Number(chk.dataset.chkId)) : (globalChecklists||[]).find(x=>x && x.id===Number(chk.dataset.chkId));
                    if(l){
                        if(target.classList.contains('chk-checkbox')){
                            const row = target.closest('.chk-item-row');
                            const i=(l.items||[]).find(x=>x && x.id===Number(row.dataset.itemId));
                            if(i){
                                i.isChecked=target.checked; 
                                if(i.isChecked){ row.classList.add('completed'); if(l.items.length>0&&l.items.every(x=>x.isChecked)) showToast('완료하셨습니다!'); }
                                else{ row.classList.remove('completed'); }
                                
                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(l.id)), { items: l.items });
                            }
                        }
                        if(target.classList.contains('monthly-item-status')) {
                            const row = target.closest('.chk-item-row');
                            const i=(l.items||[]).find(x=>x && x.id===Number(row.dataset.itemId));
                            if(i){ 
                                i.status = target.value; 
                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(l.id)), { items: l.items });
                                syncFutureItemEdit(uid, monthlyChkState.month, l.syncGroupId||l.id, i);
                            }
                        }
                    }
                }
                
                const tr = target.closest('tr');
                const db = getDB();
                if (tr && tr.dataset.userId && db) {
                    const user = (db.users||[]).find(u => u && u.id === tr.dataset.userId);
                    if (user) {
                        if (target.classList.contains('admin-edit-name')) user.name = target.value;
                        if (target.classList.contains('admin-edit-status')) user.status = target.value;
                        if (target.classList.contains('admin-edit-group')) user.group = target.value;
                        if (target.classList.contains('admin-edit-role')) { user.role = target.value; if(user.role === 'admin' && !user.menus.includes('admin')) user.menus.push('admin'); }
                        if (target.classList.contains('admin-menu-chk')) { const v = target.value; if (target.checked) { if (!user.menus.includes(v)) user.menus.push(v); } else { user.menus = user.menus.filter(m => m !== v); } }
                        saveDB(db);
                    }
                }
            } catch (err) {
                console.error("Change Event Error:", err);
            }
        });

        // =====================================================================
        // 앱 시작: 비동기로 파이어베이스 데이터 불러오기
        // =====================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('savedId')) {
                document.getElementById('user-id').value = localStorage.getItem('savedId');
                document.getElementById('save-id').checked = true;
            }
            
            await initDB(); 

            const session = sessionStorage.getItem('currentUser');
            if (session) { enterApp(JSON.parse(session)); } 
            else { 
                const db = getDB();
                document.getElementById('login-sys-title').textContent = db ? (db.settings.sysTitle || 'QuickWork') : 'QuickWork'; 
            }
        });
    </script>
</body>
</html>
