        /* -----------------------------------------
           통합 이벤트 위임 (클릭 이벤트)
           ----------------------------------------- */
        let targetUserIdForPw = null; 

        document.body.addEventListener('click', async (e) => {
            const target = e.target;
            
            if (target.id === 'btn-backup-db') {
                const db = getDB();
                if (!db) return alert("데이터베이스를 불러올 수 없습니다.");
                
                const backupData = { ...db, tasks: globalTasks, checklists: globalChecklists, monthlyChecklists: globalMonthlyChecklists, reports: globalReports, reportRemarks: globalReportRemarks };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "quickwork_backup_" + getTodayString() + ".json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                return;
            }
            
            if (target.id === 'btn-restore-db') { document.getElementById('backup-file-input').click(); return; }

            if (target.classList.contains('btn-cal-prev') || target.closest('.btn-cal-prev')) {
                calState.month--;
                if(calState.month < 1) { calState.month = 12; calState.year--; }
                renderCalendar();
            }
            if (target.classList.contains('btn-cal-next') || target.closest('.btn-cal-next')) {
                calState.month++;
                if(calState.month > 12) { calState.month = 1; calState.year++; }
                renderCalendar();
            }
            if (target.id === 'btn-cal-today') {
                calState.year = new Date().getFullYear();
                calState.month = new Date().getMonth() + 1;
                renderCalendar();
            }

            if (target.classList.contains('cal-task-badge')) {
                const taskId = Number(target.dataset.taskId);
                const t = globalTasks.find(x => x.id === taskId);
                if(t) {
                    const tempT = {...t, isOpen: true}; 
                    document.getElementById('task-edit-modal-body').innerHTML = createCardHTML(tempT);
                    document.getElementById('task-edit-modal').classList.remove('hidden');
                    requestAnimationFrame(resizeAllTextareas);
                }
            }

            if (target.id === 'btn-close-task-edit' || target.closest('#btn-close-task-edit')) {
                document.getElementById('task-edit-modal').classList.add('hidden');
            }

            if (target.classList.contains('btn-sort-tasks') || target.closest('.btn-sort-tasks')) {
                const btn = target.classList.contains('btn-sort-tasks') ? target : target.closest('.btn-sort-tasks');
                const status = btn.dataset.status;
                const uid = getCurrentUserId();
                let targetTasks = globalTasks.filter(t => t.userId === uid && t.status === status);
                
                targetTasks.sort((a, b) => {
                    if (!a.startDate && !b.startDate) return 0;
                    if (!a.startDate) return 1;
                    if (!b.startDate) return -1;
                    return new Date(a.startDate) - new Date(b.startDate);
                });
                
                for (let i = 0; i < targetTasks.length; i++) { await updateDoc(doc(firestoreDB, "tasks", String(targetTasks[i].id)), { order: i }); }
                showToast(`[${status}] 업무가 시작일 기준으로 자동 정렬되었습니다.`); return;
            }

            if (target.id === 'btn-prev-month' || target.closest('#btn-prev-month')) { monthlyChkState.month = getPrevMonthStr(monthlyChkState.month); document.getElementById('monthly-month-select').value = monthlyChkState.month; renderMonthlyChecklist(); }
            if (target.id === 'btn-next-month' || target.closest('#btn-next-month')) { monthlyChkState.month = getNextMonthStr(monthlyChkState.month); document.getElementById('monthly-month-select').value = monthlyChkState.month; renderMonthlyChecklist(); }
            
            if (target.id === 'btn-add-task') { 
                document.getElementById('new-task-category').value = '기본업무'; 
                document.getElementById('new-task-title').value = ''; 
                document.getElementById('new-task-status').value = '대기'; 
                document.getElementById('new-task-start').value = ''; 
                document.getElementById('new-task-end').value = ''; 
                document.getElementById('new-task-subitems-container').innerHTML = ''; 
                document.getElementById('task-add-modal').classList.remove('hidden'); 
                resizeAllTextareas(); 
                document.getElementById('new-task-category').focus(); 
            }
            if (target.id === 'btn-close-task-modal') { document.getElementById('task-add-modal').classList.add('hidden'); if(document.activeElement) document.activeElement.blur(); }
            
            if (target.id === 'btn-add-new-task-subitem') {
                const container = document.getElementById('new-task-subitems-container');
                const row = document.createElement('div');
                row.className = 'new-task-subitem-row';
                row.style.display = 'flex';
                row.style.alignItems = 'flex-start';
                row.style.gap = '0.5rem';
                row.innerHTML = `
                    <span style="padding-top:0.5rem; color:var(--color-text-sub);">▪</span>
                    <textarea rows="1" class="input-text new-task-subitem-input" placeholder="하위 항목 내용을 입력하세요" style="flex:1; padding:0.6rem; min-height:40px;" spellcheck="false"></textarea>
                    <button class="btn-icon btn-remove-new-task-subitem" style="margin-top:0.2rem; font-size:1.2rem;" title="항목 삭제">✕</button>
                `;
                container.appendChild(row);
                requestAnimationFrame(() => {
                    const ta = row.querySelector('textarea');
                    ta.focus();
                    autoResizeTextarea(ta);
                });
            }

            if (target.classList.contains('btn-remove-new-task-subitem') || target.closest('.btn-remove-new-task-subitem')) {
                const btn = target.classList.contains('btn-remove-new-task-subitem') ? target : target.closest('.btn-remove-new-task-subitem');
                btn.closest('.new-task-subitem-row').remove();
            }

            if (target.id === 'btn-save-new-task') {
                const title = document.getElementById('new-task-title').value.trim(); if (!title) return alert('업무 제목을 입력해주세요.');
                const category = document.getElementById('new-task-category').value.trim() || '기본업무'; const status = document.getElementById('new-task-status').value;
                let startDate = document.getElementById('new-task-start').value, endDate = document.getElementById('new-task-end').value;
                const today = getTodayString();
                if ((status === '진행중' || status === '보류' || status === '완료') && !startDate) startDate = today;
                if (status === '완료' && !endDate) endDate = today;

                const subItems = [];
                document.querySelectorAll('.new-task-subitem-input').forEach(input => {
                    const text = input.value.trim();
                    if (text) {
                        subItems.push({ id: Date.now() + Math.random(), text: text });
                    }
                });

                const uid = getCurrentUserId(); const newId = Date.now();
                const newTask = { id: newId, userId: uid, category: category, title: title, status: status, startDate: startDate, endDate: endDate, subItems: subItems, isOpen: true, order: -Date.now() };
                await setDoc(doc(firestoreDB, "tasks", String(newId)), newTask);
                document.getElementById('task-add-modal').classList.add('hidden'); 
                if(document.activeElement) document.activeElement.blur();
                dashState.tab = (status === '완료') ? 'completed' : 'active';
            }
            
            if (target.id === 'btn-cancel-complete') { document.getElementById('task-complete-modal').classList.add('hidden'); if(document.activeElement) document.activeElement.blur(); }
            if (target.id === 'btn-confirm-complete') {
                const taskId = Number(document.getElementById('task-complete-modal').dataset.taskId);
                const t = globalTasks.find(x => x.id === taskId);
                if(t) {
                    const dateVal = document.getElementById('complete-task-date').value || getTodayString();
                    await updateDoc(doc(firestoreDB, "tasks", String(taskId)), { status: '완료', endDate: dateVal, startDate: t.startDate || dateVal });
                }
                document.getElementById('task-complete-modal').classList.add('hidden');
                
                const editModalBody = document.getElementById('task-edit-modal-body');
                if (editModalBody && !document.getElementById('task-edit-modal').classList.contains('hidden')) {
                    document.getElementById('task-edit-modal').classList.add('hidden');
                }
                if(document.activeElement) document.activeElement.blur();
            }

            if (target.classList.contains('btn-toggle') && target.closest('.task-card')) { 
                const c = target.closest('.task-card'), t = globalTasks.find(x=>x.id===Number(c.dataset.id)); 
                if(t) await updateDoc(doc(firestoreDB, "tasks", String(t.id)), { isOpen: !t.isOpen });
            }

            if (target.classList.contains('btn-add-sub') && !target.classList.contains('btn-add-chk-item')) { 
                const t = globalTasks.find(x=>x.id===Number(target.closest('.task-card').dataset.id)); 
                if(t) {
                    await updateDoc(doc(firestoreDB, "tasks", String(t.id)), { subItems: [...(t.subItems||[]), {id:Date.now(), text:''}] });
                    
                    const editModalBody = document.getElementById('task-edit-modal-body');
                    if (editModalBody && !document.getElementById('task-edit-modal').classList.contains('hidden')) {
                        const updatedT = globalTasks.find(x => x.id === t.id);
                        if (updatedT) editModalBody.innerHTML = createCardHTML({...updatedT, isOpen: true});
                    }
                }
            }
            if (target.classList.contains('btn-del-sub')) { 
                const t = globalTasks.find(x=>x.id===Number(target.closest('.task-card').dataset.id)); 
                if(t) {
                    await updateDoc(doc(firestoreDB, "tasks", String(t.id)), { subItems: (t.subItems||[]).filter(s=>s.id!==Number(target.closest('.sub-item-row').dataset.subId)) });
                    
                    const editModalBody = document.getElementById('task-edit-modal-body');
                    if (editModalBody && !document.getElementById('task-edit-modal').classList.contains('hidden')) {
                        const updatedT = globalTasks.find(x => x.id === t.id);
                        if (updatedT) editModalBody.innerHTML = createCardHTML({...updatedT, isOpen: true});
                    }
                }
            }
            if (target.classList.contains('btn-delete') && !target.classList.contains('btn-delete-report')) { 
                if(confirm('삭제?')) {
                    await deleteDoc(doc(firestoreDB, "tasks", String(target.closest('.task-card').dataset.id)));
                    document.getElementById('task-edit-modal').classList.add('hidden'); // 삭제 시 모달 닫기
                }
            }
            
            if (target.classList.contains('tab-btn') && !target.classList.contains('report-tab')) { dashState.tab = target.dataset.tab; initDashboard(document.getElementById('content-area')); }
            if (target.classList.contains('report-tab')) { reportState.tab = target.dataset.tab; initReport(document.getElementById('content-area')); }
            
            if (target.id === 'btn-save-report') { 
                const p = document.getElementById('current-report-paper');

                const {title}=generateReportHTML(reportState.tab), uid=getCurrentUserId(), newId=Date.now(); 
                await setDoc(doc(firestoreDB, "reports", String(newId)), {id:newId, userId: uid, type:reportState.tab, title, html:p.innerHTML}); 
                alert('저장완료!'); reportState.tab='archive'; initReport(document.getElementById('content-area'));

            if (target.classList.contains('btn-add-remark')) {

                arr.push({id:Date.now(), userId: uid, text:''}); 
                await setDoc(doc(firestoreDB, "reportRemarks", rKey), { remarks: arr });
            }
            if (target.classList.contains('btn-del-remark')) { 
                const rKey=target.closest('.report-remarks-list').dataset.remarkKey, subId=Number(target.closest('.sub-item-row').dataset.subId);
                const arr = (globalReportRemarks[rKey] || []).filter(r=>r.id!==subId);
                await setDoc(doc(firestoreDB, "reportRemarks", rKey), { remarks: arr });
            }
            if (target.closest('.archive-item') && !target.classList.contains('btn-delete-report')) { 
                const r=globalReports.find(x=>x.id===Number(target.closest('.archive-item').dataset.id)); 
                if(r){document.getElementById('report-modal-body').innerHTML=`<div class="report-paper" style="box-shadow:none;border:none;padding:1rem;">${r.html}</div>`; document.getElementById('report-modal').classList.remove('hidden');} 
            }
            if (target.classList.contains('btn-delete-report')) { 
                if(confirm('삭제?')){ await deleteDoc(doc(firestoreDB, "reports", String(target.closest('.archive-item').dataset.id))); } 
            }

                const c = target.closest('.chk-card'), isMonthly = c.dataset.isMonthly==='true';
                const l = isMonthly ? globalMonthlyChecklists.find(x=>x.id===Number(c.dataset.chkId)) : globalChecklists.find(x=>x.id===Number(c.dataset.chkId)); 
                if(l) await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(l.id)), { isOpen: !l.isOpen });
            }
            if (target.id === 'btn-add-checklist') { 
                const uid=getCurrentUserId(), newObj = {id:Date.now(), syncGroupId:Date.now(), userId:uid, title:'', isOpen:true, items:[], order: -Date.now()}; 
                await setDoc(doc(firestoreDB, "checklists", String(newObj.id)), newObj); 
            }
            
            if (target.id === 'btn-add-monthly-checklist') { 
                const uid=getCurrentUserId(), newObj = {id:Date.now(), syncGroupId:Date.now(), userId:uid, month:monthlyChkState.month, title:'', isOpen:true, items:[], order: -Date.now()}; 
                await setDoc(doc(firestoreDB, "monthlyChecklists", String(newObj.id)), newObj); 
                syncFutureGroupAdd(uid,monthlyChkState.month,newObj);

                const c=target.closest('.chk-card'), isMonthly = c.dataset.isMonthly==='true', uid=getCurrentUserId();
                const l = isMonthly ? globalMonthlyChecklists.find(x=>x.id===Number(c.dataset.chkId)) : globalChecklists.find(x=>x.id===Number(c.dataset.chkId));

        /* 🚨 60fps 부드러운 Drag & Drop 및 Edge Auto-scroll */
        let draggedItem = null; let dragType = null; let scrollRAF = null; let scrollDir = 0; let scrollTarget = null;
        function startAutoScroll(target, dir) { if (scrollRAF) return; scrollTarget = target; scrollDir = dir; function step() { if (!scrollTarget) return; scrollTarget.scrollTop += scrollDir * 12; scrollRAF = requestAnimationFrame(step); } scrollRAF = requestAnimationFrame(step); }
        function stopAutoScroll() { if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; scrollTarget = null; scrollDir = 0; } }
        function handleAutoScroll(e) {
            const margin = 60; let target = document.getElementById('main-content');
            if ((dragType === 'item' || dragType === 'memo' || dragType === 'subItem') && draggedItem) { const body = draggedItem.closest('.chk-body') || draggedItem.closest('.task-body'); if (body) target = body; }
            const rect = target.getBoundingClientRect();
            if (e.clientY < rect.top + margin) startAutoScroll(target, -1); else if (e.clientY > rect.bottom - margin) startAutoScroll(target, 1); else stopAutoScroll();
        }

        document.addEventListener('dragstart', (e) => {
            if (e.target.classList) {
                window.isDragging = true;
                if (e.target.classList.contains('chk-item-row')) { draggedItem = e.target; dragType = 'item'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('item-dragging'), 0); } 
                else if (e.target.classList.contains('chk-card') || e.target.classList.contains('task-card')) { draggedItem = e.target; dragType = 'card'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('card-dragging'), 0); }
                else if (e.target.classList.contains('memo-row')) { draggedItem = e.target; dragType = 'memo'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('memo-dragging'), 0); }
                else if (e.target.classList.contains('sub-item-row')) { draggedItem = e.target; dragType = 'subItem'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('memo-dragging'), 0); }
                else if (e.target.classList.contains('cal-task-badge')) { draggedItem = e.target; dragType = 'cal-badge'; e.dataTransfer.effectAllowed = "move"; setTimeout(() => e.target.classList.add('item-dragging'), 0); }
            }
        });
        
        document.addEventListener('dragover', (e) => {
            if (!draggedItem) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; handleAutoScroll(e);
            
            if (dragType === 'item') {
                const row = e.target.closest('.chk-item-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            } else if (dragType === 'card') {
                const cardClass = draggedItem.classList.contains('chk-card') ? '.chk-card' : '.task-card'; const card = e.target.closest(cardClass);
                if (card && card !== draggedItem && card.parentNode === draggedItem.parentNode) {
                    const bounding = card.getBoundingClientRect(); const isAfter = (e.clientX - bounding.x > bounding.width / 2) || (e.clientY - bounding.y > bounding.height / 2);
                    if (isAfter) card.after(draggedItem); else card.before(draggedItem);
                }
            } else if (dragType === 'memo') {
                const row = e.target.closest('.memo-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            } else if (dragType === 'subItem') {
                const row = e.target.closest('.sub-item-row');
                if (row && row !== draggedItem && row.parentNode === draggedItem.parentNode) {
                    const bounding = row.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) row.after(draggedItem); else row.before(draggedItem);
                }
            }
            else if (dragType === 'cal-badge') {
                const badge = e.target.closest('.cal-task-badge');
                const cell = e.target.closest('.cal-cell');
                if (badge && badge !== draggedItem && badge.parentNode === draggedItem.parentNode) {
                    const bounding = badge.getBoundingClientRect(); const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY > offset) badge.after(draggedItem); else badge.before(draggedItem);
                } else if (cell && cell !== draggedItem.parentNode && !e.target.closest('.cal-task-badge')) {
                    cell.appendChild(draggedItem);
                }
            }
        });
        
        document.addEventListener('drop', async (e) => {
            if (!draggedItem) return; e.preventDefault(); stopAutoScroll();
            
            if (dragType === 'item') {
                const chkCard = draggedItem.closest('.chk-card');
                if(chkCard) {
                    const isMonthly = chkCard.dataset.isMonthly === 'true';
                    const listId = Number(chkCard.dataset.chkId);

                        }

                        for (let i = 0; i < sortedIds.length; i++) {
                            await updateDoc(doc(firestoreDB, "tasks", String(sortedIds[i])), { order: i });
                        }
                    }
                }
            } else if (dragType === 'memo') {
                const chkCard = draggedItem.closest('.chk-card');

                if(chkCard && itemRow) {

                        const uid = getCurrentUserId();

                    }
                }
            } else if (dragType === 'subItem') {
                const taskCard = draggedItem.closest('.task-card');
                if(taskCard) {
                    const taskId = Number(taskCard.dataset.id);
                    const task = globalTasks.find(t => t.id === taskId);

                        const sortedIds = currentSubNodes.map(node => Number(node.dataset.subId));
                        
                        const newSubItems = [...task.subItems];
                        newSubItems.sort((a, b) => sortedIds.indexOf(a.id) - sortedIds.indexOf(b.id));
                        
                        await updateDoc(doc(firestoreDB, "tasks", String(taskId)), { subItems: newSubItems });
                    }
                }
            }
            else if (dragType === 'cal-badge') {
                const cell = draggedItem.closest('.cal-cell');
                if (cell) {
                    const dateStr = cell.dataset.date;
                    const taskId = Number(draggedItem.dataset.taskId);
                    const taskToUpdate = globalTasks.find(t => t.id === taskId);

                    if (taskToUpdate && dateStr) {
                        let updatePayload = {};
                        let isDateChanged = false;

                        if (taskToUpdate.status === '완료') {
                            if (taskToUpdate.endDate !== dateStr) { updatePayload.endDate = dateStr; isDateChanged = true; }
                        } else {
                            if (taskToUpdate.startDate !== dateStr) { updatePayload.startDate = dateStr; isDateChanged = true; }
                        }

                        if (isDateChanged) await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);

                        const currentNodes = Array.from(cell.querySelectorAll('.cal-task-badge'));
                        for (let i = 0; i < currentNodes.length; i++) {
                            const id = Number(currentNodes[i].dataset.taskId);
                            await updateDoc(doc(firestoreDB, "tasks", String(id)), { order: i });
                        }
                    }
                }
            }
            
            draggedItem.classList.remove('item-dragging', 'card-dragging', 'memo-dragging'); draggedItem = null; dragType = null;
            window.isDragging = false;
        });

                    if(shouldUpdate) await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);
                }
            }

            if (target.classList.contains('chk-title') || target.classList.contains('chk-text') || target.classList.contains('chk-memo')) {
                const uid = getCurrentUserId(), chkCard = target.closest('.chk-card');
                if (chkCard) {
                    const isMonthly = chkCard.dataset.isMonthly === 'true';
                    const list = isMonthly ? globalMonthlyChecklists.find(c => c.id === Number(chkCard.dataset.chkId)) : globalChecklists.find(c => c.id === Number(chkCard.dataset.chkId));
                    if (list) {
                        if (target.classList.contains('chk-title')) {
                            await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { title: list.title });
                            if(isMonthly) syncFutureGroupTitle(uid, monthlyChkState.month, list.syncGroupId||list.id, list.title);
                        } else if (target.closest('.chk-item-row')) {
                            const item = list.items.find(i => i.id === Number(target.closest('.chk-item-row').dataset.itemId));
                            if (item) {
                                await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(list.id)), { items: list.items });
                                if(isMonthly) syncFutureItemEdit(uid, monthlyChkState.month, list.syncGroupId||list.id, item);
                            }
                        }
                    }
                }
            }
        });

        document.body.addEventListener('change', async (e) => {
            const target = e.target; 
            
            if (target.id === 'backup-file-input') {
                const file = target.files[0];
                if (!file) return;

                if (!confirm("🚨 [경고] 복원을 진행하면 현재 시스템의 모든 데이터가 업로드한 파일의 내용으로 완전히 덮어씌워집니다.\n\n정말 시스템을 복원하시겠습니까?")) {
                    target.value = ''; 
                    return;
                }

                const reader = new FileReader();
                reader.onload = async function(event) {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (!parsedData.users || !parsedData.settings) throw new Error("올바른 QuickWork 백업 파일 형식이 아닙니다.");
                        
                        isDBConnected = true; 
                        
                        if (parsedData.tasks) for (let t of parsedData.tasks) await setDoc(doc(firestoreDB, "tasks", String(t.id)), t);
                        if (parsedData.checklists) for (let t of parsedData.checklists) await setDoc(doc(firestoreDB, "checklists", String(t.id)), t);
                        if (parsedData.monthlyChecklists) for (let t of parsedData.monthlyChecklists) await setDoc(doc(firestoreDB, "monthlyChecklists", String(t.id)), t);
                        if (parsedData.reports) for (let t of parsedData.reports) await setDoc(doc(firestoreDB, "reports", String(t.id)), t);
                        if (parsedData.reportRemarks) {
                            for (let [key, arr] of Object.entries(parsedData.reportRemarks)) await setDoc(doc(firestoreDB, "reportRemarks", key), { remarks: arr });
                        }
                        
                        parsedData.tasks = []; parsedData.checklists = []; parsedData.monthlyChecklists = []; parsedData.reports = []; parsedData.reportRemarks = {};
                        parsedData.lastSyncTime = Date.now();
                        await setDoc(doc(firestoreDB, "WorkSystem", DB_KEY), parsedData);
                        
                        alert("✅ 데이터 복원이 성공적으로 완료되었습니다.\n시스템을 다시 시작합니다.");
                        location.reload(); 
                    } catch (error) {
                        alert("파일을 읽는 중 오류가 발생했습니다: " + error.message);
                    }
                    target.value = ''; 
                };
                reader.readAsText(file);
                return;
            }
            
            const c=target.closest('.task-card'); 
            if(c && target.classList.contains('task-status')){
                const taskId = Number(c.dataset.id);
                const t = globalTasks.find(x => x.id === taskId);
                
                if(t){
                    const n=target.value, today=getTodayString();
                    
                    if(n === '완료') {
                        target.value = t.status; 
                        document.getElementById('complete-task-date').value = t.endDate || today;
                        document.getElementById('task-complete-modal').dataset.taskId = t.id;
                        document.getElementById('task-complete-modal').classList.remove('hidden');
                        return;
                    }
                    
                    let updatePayload = { status: n };
                    if((n === '진행중' || n === '보류') && !t.startDate) updatePayload.startDate = today;
                    await updateDoc(doc(firestoreDB, "tasks", String(taskId)), updatePayload);
                    
                    if(c.closest('#task-edit-modal-body')) {
                        document.getElementById('task-edit-modal').classList.add('hidden');
                    }
                    return;
                }
            }
            
            if(target.id==='select-weekly'){reportState.selectedWeek=target.value;renderReportContent();} if(target.id==='select-monthly'){reportState.selectedMonth=target.value;renderReportContent();}
            if(target.classList.contains('remark-text')){
                const list = target.closest('.report-remarks-list');
                const row = target.closest('.sub-item-row');
                if(list && row) {
                    const rKey = list.dataset.remarkKey;
                    const arr = globalReportRemarks[rKey] || [];
                    const r=arr.find(x=>x.id===Number(row.dataset.subId));
                    if(r){
                        r.text=target.value;
                        target.setAttribute('value',target.value);
                        await setDoc(doc(firestoreDB, "reportRemarks", rKey), { remarks: arr });
                    }
                }
            }
            
            if (target.id === 'monthly-month-select') { monthlyChkState.month = target.value; renderMonthlyChecklist(); }

            const chk=target.closest('.chk-card'); 
            if(chk){
                const isMonthly = chk.dataset.isMonthly === 'true';
                const uid = getCurrentUserId();
                const l = isMonthly ? globalMonthlyChecklists.find(x=>x.id===Number(chk.dataset.chkId)) : globalChecklists.find(x=>x.id===Number(chk.dataset.chkId));
                if(l){
                    if(target.classList.contains('chk-checkbox')){
                        const row = target.closest('.chk-item-row');
                        const i=(l.items||[]).find(x=>x.id===Number(row.dataset.itemId));
                        if(i){
                            i.isChecked=target.checked; 
                            if(i.isChecked){ target.closest('.chk-item-row').classList.add('completed'); if(l.items.length>0&&l.items.every(x=>x.isChecked)) showToast('완료하셨습니다!'); }
                            else{ target.closest('.chk-item-row').classList.remove('completed'); }
                            
                            await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(l.id)), { items: l.items });
                        }
                    }
                    if(target.classList.contains('monthly-item-status')) {
                        const row = target.closest('.chk-item-row');
                        const i=(l.items||[]).find(x=>x.id===Number(row.dataset.itemId));
                        if(i){ 
                            i.status = target.value; 
                            await updateDoc(doc(firestoreDB, isMonthly ? "monthlyChecklists" : "checklists", String(l.id)), { items: l.items });
                            syncFutureItemEdit(uid, monthlyChkState.month, l.syncGroupId||l.id, i);
                        }
                    }
                }
            }
            
            const tr = target.closest('tr');
            const db = getDB();
            if (tr && tr.dataset.userId && db) {
                const user = db.users.find(u => u.id === tr.dataset.userId);
                if (user) {
                    if (target.classList.contains('admin-edit-name')) user.name = target.value;
                    if (target.classList.contains('admin-edit-status')) user.status = target.value;
                    if (target.classList.contains('admin-edit-group')) user.group = target.value;
                    if (target.classList.contains('admin-edit-role')) { user.role = target.value; if(user.role === 'admin' && !user.menus.includes('admin')) user.menus.push('admin'); }
                    if (target.classList.contains('admin-menu-chk')) { const v = target.value; if (target.checked) { if (!user.menus.includes(v)) user.menus.push(v); } else { user.menus = user.menus.filter(m => m !== v); } }
                    saveDB(db);
                }
            }
        });

        // =====================================================================
        // 앱 시작: 비동기로 파이어베이스 데이터 불러오기
        // =====================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('savedId')) {
                document.getElementById('user-id').value = localStorage.getItem('savedId');
                document.getElementById('save-id').checked = true;
            }
            
            await initDB(); 

            const session = sessionStorage.getItem('currentUser');
            if (session) { enterApp(JSON.parse(session)); } 
            else { 
                const db = getDB();
                document.getElementById('login-sys-title').textContent = db ? db.settings.sysTitle : 'QuickWork'; 
            }
        });
    </script>
</body>
</html>
