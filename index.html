<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 관리 시스템</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* =========================================
           1. CSS 변수 및 공통 리셋 (라이트/다크 모드 지원)
           ========================================= */
        :root {
            --color-primary: #4338CA;
            --color-primary-light: #EEF2FF;
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-text-main: #1E293B;
            --color-text-sub: #64748B;
            --color-border: #E2E8F0;
            --status-wait: #94A3B8;
            --status-ing: #2563EB;
            --status-hold: #F59E0B;
            --status-done: #10B981;
            --border-radius-sm: 6px;
            --border-radius: 12px;
            --font-family: 'Pretendard', sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --color-bg: #0F172A;
            --color-surface: #1E293B;
            --color-text-main: #F8FAFC;
            --color-text-sub: #E2E8F0;
            --color-border: #334155;
            --color-primary-light: #312E81;
        }
        body.dark-mode * { color: #F8FAFC !important; }
        body.dark-mode .input-text, body.dark-mode .inline-input, body.dark-mode .inline-select, body.dark-mode select.input-text { background: #0F172A !important; border-color: #475569 !important; color: #F8FAFC !important; }
        body.dark-mode .input-text:focus, body.dark-mode .inline-input:focus, body.dark-mode .inline-select:focus { box-shadow: 0 0 0 3px #312E81 !important; border-color: #818CF8 !important; }
        
        body.dark-mode input[type="month"]::-webkit-calendar-picker-indicator,
        body.dark-mode input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        body.dark-mode .btn-outline { border-color: #475569 !important; }
        body.dark-mode .kanban-col { background: #1E293B !important; border-color: #334155 !important; }
        body.dark-mode .task-card, body.dark-mode .chk-card, body.dark-mode .report-paper, body.dark-mode .archive-item, body.dark-mode .admin-section, body.dark-mode .login-box, body.dark-mode .modal-content { background: #1E293B !important; border-color: #334155 !important; }
        body.dark-mode .chk-item-row { background: #0F172A !important; border-color: #334155 !important; }
        body.dark-mode .chk-item-row:hover { background: #1E293B !important; }
        body.dark-mode .chk-memo { background: #1E293B !important; border-color: #475569 !important; }
        body.dark-mode .admin-table th { background: #0F172A !important; border-color: #334155 !important; }
        body.dark-mode .admin-table td { border-color: #334155 !important; }
        body.dark-mode .admin-table tr:hover td { background: #0F172A !important; }
        body.dark-mode .menu-chk-group label { background: #312E81 !important; }
        body.dark-mode .btn-toggle, body.dark-mode .btn-toggle-chk, body.dark-mode .task-category { background: transparent !important; border-color: #475569 !important; }
        body.dark-mode .duration-badge { border-color: #475569 !important; color: #94A3B8 !important; }
        body.dark-mode .btn-primary { background-color: #4F46E5 !important; }
        body.dark-mode .btn-primary:hover { background-color: #4338CA !important; }
        
        body.dark-mode .group-status-title.done { color: #34D399 !important; }
        body.dark-mode .group-status-title.done::before { background-color: #34D399 !important; }
        body.dark-mode .group-status-title.ing { color: #60A5FA !important; }
        body.dark-mode .group-status-title.ing::before { background-color: #60A5FA !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; font-family: var(--font-family); color: var(--color-text-main); background-color: var(--color-bg); letter-spacing: -0.01em; transition: background-color 0.3s, color 0.3s; scroll-behavior: smooth; }
        body { line-height: 1.6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
        body.dark-mode ::-webkit-scrollbar-thumb { background: #475569; }
        body.dark-mode ::-webkit-scrollbar-thumb:hover { background: #64748B; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: var(--border-radius-sm); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: var(--color-primary); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background-color: #3730A3; transform: translateY(-1px); }
        .btn-outline { background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text-main); }
        .btn-outline:hover { background-color: var(--color-bg); }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--color-text-sub); transition: color 0.2s; padding: 0.25rem; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { color: #EF4444; background: #FEE2E2; }
        
        textarea.input-text, textarea.inline-input { overflow-y: hidden; resize: none; box-sizing: border-box; font-family: inherit; line-height: 1.5; vertical-align: middle; word-break: keep-all; overflow-wrap: break-word; white-space: pre-wrap; width: 100%; }
        textarea.inline-input { min-height: 1.8rem; padding-top: 0.2rem; padding-bottom: 0.2rem; }
        
        .input-text { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); font-size: 0.95rem; font-family: inherit; transition: all 0.2s; background: var(--color-surface); color: var(--color-text-main); }
        .input-text:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
        select.input-text { cursor: pointer; }
        .inline-input, .inline-select { border: 1px solid transparent; background: transparent; font-family: inherit; padding: 0.3rem 0.4rem; border-radius: 4px; transition: all 0.2s; margin: -1px; color: var(--color-text-main); }
        .inline-input:hover { border-bottom: 1px dashed #94A3B8; }
        .inline-input:focus { outline: none; border: 1px solid var(--color-primary); background: var(--color-surface); box-shadow: 0 0 0 3px var(--color-primary-light); margin: -1px; }

        /* =========================================
           2. 레이아웃 & 모달
           ========================================= */
        #login-view { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--color-bg); }
        .login-box { background: var(--color-surface); padding: 2.5rem; border-radius: var(--border-radius); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; border: 1px solid var(--color-border); }
        .login-box h1 { font-size: 1.5rem; text-align: center; margin-bottom: 2rem; font-weight: 800; color: var(--color-primary); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--color-text-sub); }
        .login-options { display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 1.5rem; color: var(--color-text-sub); }

        #app-view { display: flex; height: 100vh; position: relative; }
        #sidebar { width: 260px; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 8px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 1.5rem; font-weight: 800; font-size: 1.2rem; color: var(--color-primary); display: flex; align-items: center; gap: 0.5rem; }
        .nav-menu { flex: 1; padding: 1rem 0.75rem; overflow-y: auto; }
        .nav-item { padding: 0.8rem 1rem; margin-bottom: 0.25rem; display: block; cursor: pointer; color: var(--color-text-sub); transition: all 0.2s; border-radius: var(--border-radius-sm); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: var(--color-primary-light); color: var(--color-primary); font-weight: 700; }
        .sidebar-footer { padding: 1.25rem; border-top: 1px solid var(--color-border); font-size: 0.875rem; background: var(--color-bg); }
        #main-content { flex: 1; padding: 2rem 2.5rem; overflow-y: auto; background-color: var(--color-bg); position: relative; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--color-surface); padding: 2rem; border-radius: var(--border-radius); width: 90%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid var(--color-border); }
        .modal-content.large { max-width: 850px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; }
        .modal-footer { margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .modal-footer.right { justify-content: flex-end; gap: 0.75rem; }

        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast { background: var(--color-primary); color: white; padding: 1rem 2rem; border-radius: 30px; font-weight: 700; font-size: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); animation: toastFadeIn 0.4s, toastFadeOut 0.4s 3s forwards; display: flex; align-items: center; gap: 0.5rem; }
        @keyframes toastFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastFadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

        #btn-stop-impersonation { position: fixed; bottom: 2.5rem; right: 2.5rem; z-index: 10000; background: #EF4444; color: white !important; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); padding: 1rem 1.5rem; font-size: 1rem; font-weight: 800; border-radius: 30px; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; border: none; transition: all 0.2s; }
        #btn-stop-impersonation:hover { background: #DC2626; transform: translateY(-3px); }

        /* =========================================
           3. 공통 모듈 (대시보드 및 캘린더)
           ========================================= */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap:1rem; }
        .tabs { display: flex; gap: 1rem; border-bottom: 2px solid var(--color-border); margin-bottom: 2rem; }
        .tab-btn { background: none; border: none; padding: 0.5rem 0.5rem 1rem 0.5rem; font-size: 1.05rem; font-weight: 700; color: var(--color-text-sub); cursor: pointer; position: relative; transition: color 0.2s; }
        .tab-btn:hover { color: var(--color-text-main); }
        .tab-btn.active { color: var(--color-primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background-color: var(--color-primary); border-radius: 3px 3px 0 0; }

        .kanban-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; align-items: start; }
        .kanban-col { background: var(--color-surface); border-radius: var(--border-radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; min-height: 60vh; border: 1px solid var(--color-border); }
        .col-title { font-size: 1.05rem; font-weight: 800; padding-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; color: var(--color-text-main); }
        .task-list.grid-view { display: grid; grid-template-columns: repeat(2, 1fr); align-items: start; gap: 1.5rem; }
        
        .task-card, .chk-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); padding: 1rem; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; cursor: grab; }
        .task-card:hover, .chk-card:hover { box-shadow: var(--shadow-md); border-color: var(--color-primary-light); }
        .task-card:active, .chk-card:active { cursor: grabbing; }
        
        .drag-handle { color: var(--color-text-sub); font-size: 1.2rem; font-weight: bold; letter-spacing: -2px; padding-top: 0.3rem; opacity: 0.3; transition: opacity 0.2s; user-select: none; line-height: 1; cursor: grab; }
        .memo-drag-handle, .sub-drag-handle { font-size: 1.1rem; padding-top: 0.3rem; padding-left: 2px; padding-right: 2px; }
        .chk-item-row:hover > .drag-handle, .memo-row:hover .memo-drag-handle, .sub-item-row:hover .sub-drag-handle { opacity: 1; }
        
        .memo-row, .sub-item-row { border: 1px solid transparent; transition: background 0.2s, border 0.2s; border-radius: 4px; padding: 2px; }
        .memo-row:hover, .sub-item-row:hover { background: var(--color-bg); border-color: var(--color-border); }
        .memo-row:active, .sub-item-row:active { cursor: grabbing; }
        
        .card-dragging { opacity: 0.5; transform: scale(0.98); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); z-index: 100; border: 2px dashed var(--color-primary) !important; }
        .item-dragging { opacity: 0.4; background: var(--color-primary-light) !important; border: 2px dashed var(--color-primary) !important; }
        .memo-dragging { opacity: 0.4; background: var(--color-primary-light) !important; border: 1px dashed var(--color-primary) !important; }
        .card-dragging *, .item-dragging *, .memo-dragging * { pointer-events: none !important; }

        .task-header { display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; flex-wrap: nowrap; }
        .task-controls { display: flex; align-items: flex-start; gap: 0.5rem; flex-shrink: 0; margin-top: 0.1rem; white-space: nowrap; }
        .btn-toggle { flex-shrink: 0; background: transparent; border: 1px solid var(--color-border); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; color: var(--color-text-sub); display: flex; align-items: center; justify-content: center; margin-top: 0.1rem; }
        .task-category { width: 85px !important; min-width: 85px !important; text-align: center; font-weight: 700; font-size: 0.8rem; border-radius: 20px; flex-shrink: 0; margin-top: 0.1rem; }
        .task-title { flex: 1; min-width: 150px !important; font-weight: 800; font-size: 1.05rem; }
        .task-body { margin-top: 1rem; padding-left: 2.7rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .sub-items-list { display: flex; flex-direction: column; gap: 0.25rem; }
        .sub-item-row { display: flex; gap: 0.5rem; align-items: flex-start; width: 100%; }
        .sub-item-text { flex: 1; font-size: 0.9rem; min-width: 100px !important; }
        .btn-add-sub, .btn-add-remark { background: none; border: 1px dashed var(--color-border); color: var(--color-text-sub); border-radius: 4px; padding: 0.4rem; font-size: 0.8rem; cursor: pointer; transition: 0.2s; margin-top: 0.25rem; width: 100%; text-align: left; }
        .task-footer { display: flex; gap: 1.5rem; align-items: center; font-size: 0.8rem; color: var(--color-text-sub); margin-top: 0.5rem; padding-top: 0.75rem; border-top: 1px dashed var(--color-border); }
        .task-footer .inline-input { padding: 0.1rem 0.3rem; font-size: 0.85rem; width: 120px; font-weight: 600; }

        /* 🚨 업무 캘린더 전용 CSS */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--color-border); border: 1px solid var(--color-border); border-radius: var(--border-radius); overflow: hidden; margin-top: 1rem; }
        .cal-day-name { background: var(--color-primary-light); text-align: center; padding: 0.75rem 0.5rem; font-weight: 800; color: var(--color-text-main); font-size: 0.95rem; }
        .cal-cell { background: var(--color-surface); min-height: 130px; padding: 0.5rem; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; transition: background-color 0.2s; cursor: pointer; }
        .cal-cell:hover { background: var(--color-bg); }
        .cal-date { font-size: 0.9rem; font-weight: 700; color: var(--color-text-sub); margin-bottom: 6px; text-align: right; padding: 2px; user-select: none; }
        .cal-date.today { color: white; background: var(--color-primary); border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; align-self: flex-end; }
        .cal-task-badge { font-size: 0.8rem; padding: 0.3rem 0.5rem; border-radius: 4px; color: white; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; transition: transform 0.1s; }
        .cal-task-badge:hover { filter: brightness(0.9); transform: translateY(-1px); }
        .cal-task-badge:active { cursor: grabbing; }
        .cal-cell.other-month { background: var(--color-bg); opacity: 0.5; }
        
        #task-edit-modal .modal-content { 
            max-width: 650px; 
            background: var(--color-bg); 
            padding: 1.5rem; 
            border-radius: var(--border-radius);
            position: relative;
        }
        #btn-close-task-edit {
            position: absolute;
            top: -15px; 
            right: -15px;
            background: #EF4444;
            color: white;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            transition: 0.2s;
            cursor: pointer;
        }
        #btn-close-task-edit:hover { background: #DC2626; transform: scale(1.1); }
        #task-edit-modal .task-card { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid var(--color-border); background: var(--color-surface); margin-top: 0.5rem; }

        /* =========================================
           4. 보고서 레이아웃 (🚨 PDF 잘림 및 띄어쓰기 붕괴 완벽 픽스)
           ========================================= */
        .report-header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 3px solid var(--color-text-main); page-break-after: avoid; break-after: avoid; }
        .report-title-main { font-size: 1.8rem; font-weight: 900; line-height: 1.3; white-space: pre-line; margin-bottom: 0.5rem; color: var(--color-text-main); letter-spacing: -0.02em; }
        .report-meta { font-size: 0.9rem; color: var(--color-text-sub); font-weight: 500; }
        .report-paper { background: var(--color-surface); padding: 3.5rem 3rem; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--color-border); max-width: 850px; margin: 0 auto; color: var(--color-text-main); }
        
        .group-category { margin-bottom: 3rem; page-break-inside: avoid; break-inside: avoid; }
        .report-task { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; margin-bottom: 0; padding: 1rem 0.5rem; border-bottom: 1px solid var(--color-bg); page-break-inside: avoid; break-inside: avoid; }
        
        .group-category-title { font-size: 1.25rem; font-weight: 800; color: var(--color-primary); padding-bottom: 0.5rem; border-bottom: 2px solid var(--color-border); margin-bottom: 1.5rem; letter-spacing: -0.01em; page-break-after: avoid; break-after: avoid; }
        .group-status { margin-bottom: 1.5rem; padding-left: 1.2rem; border-left: 3px solid var(--color-border); }
        .group-status.done { border-left-color: var(--status-done); }
        .group-status.ing { border-left-color: var(--status-ing); }
        .group-status-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 6px; color: var(--color-text-main); }
        .group-status-title.done { color: #064E3B; background: #D1FAE5; }
        .group-status-title.ing { color: #1E3A8A; background: #DBEAFE; }
        
        .report-task:last-child { border-bottom: none; }
        .report-task-content { flex: 1; min-width: 0; } 
        .report-task-title { font-weight: 700; font-size: 1.05rem; color: var(--color-text-main); margin-bottom: 0.4rem; display: flex; align-items: flex-start; gap: 0.4rem; line-height: 1.4; white-space: pre-wrap; word-break: keep-all; }
        .report-task-title::before { content: '▪'; color: var(--color-border); font-size: 0.8rem; margin-top: 0.1rem; }
        
        .report-task-date { flex-shrink: 0; font-size: 0.85rem; color: var(--color-text-sub); text-align: right; min-width: 150px; line-height: 1.6; font-weight: 500; display: flex; flex-direction: column; align-items: flex-end; }
        .duration-badge { display: inline-block; border: 1px solid var(--color-border); color: var(--color-text-sub); background: transparent; padding: 0.1rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.75rem; margin-top: 4px; }
        .report-task-subs { padding-left: 1.2rem; font-size: 0.9rem; color: var(--color-text-sub); }
        .report-task-subs li { margin-bottom: 0.25rem; line-height: 1.5; list-style: none; white-space: pre-wrap; word-break: keep-all; }
        
        /* 🚨 PDF 출력 시 띄어쓰기 붕괴, 페이지 잘림, 날짜 줄바꿈 강제 방어 클래스 */
        .pdf-export-mode, .pdf-export-mode * { 
            letter-spacing: 0px !important; 
            word-spacing: 0px !important; 
            text-rendering: optimizeLegibility !important; 
        }
        .pdf-export-mode .report-task { display: block !important; page-break-inside: avoid !important; break-inside: avoid !important; padding: 1.5rem 0.5rem; border-bottom: 1px solid #E2E8F0; }
        .pdf-export-mode .group-category { page-break-inside: avoid !important; break-inside: avoid !important; }
        
        /* 🚨 날짜 2줄 바꿈 해결: 날짜 영역 너비를 35%로 늘리고, 줄바꿈(nowrap) 강제 금지 */
        .pdf-export-mode .report-task-content { float: left !important; width: 65% !important; }
        .pdf-export-mode .report-task-date { float: right !important; width: 35% !important; text-align: right !important; white-space: nowrap !important; }
        
        /* 🚨 26.08 월 띄어쓰기 오류 해결: PDF 변환 시 단어 끊기 기준을 조정하여 숫자+한글 분리 현상 방지 */
        .pdf-export-mode .report-task-title { word-break: break-all !important; display: block !important; }
        
        .pdf-export-mode .report-task::after { content: ""; display: table; clear: both; }
        .pdf-export-mode .group-status-title { display: inline-block !important; }

        .archive-list { display: flex; flex-direction: column; gap: 1rem; max-width: 850px; margin: 0 auto; }

        @media (max-width: 1200px) { .checklist-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 800px) { .checklist-grid { grid-template-columns: 1fr; } }

        .chk-progress-bar { background: var(--color-border); height: 5px; border-radius: 4px; overflow: hidden; width: 100%; margin-top: 4px; }
        .chk-progress-fill { background: var(--color-primary); height: 100%; transition: width 0.3s ease; }
        
        .chk-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.5rem; padding-bottom: 1rem; }
        .btn-toggle-chk { background: transparent; border: 1px solid var(--color-border); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; color: var(--color-text-sub); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; margin-right: 0.5rem; margin-top: 0.2rem; }
        
        .chk-title { font-size: 1.15rem; font-weight: 800; color: var(--color-primary); flex: 1; padding: 0.2rem 0.5rem; min-width: 120px !important; }
        .chk-item-row { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.75rem 0.5rem; border-radius: 8px; transition: transform 0.2s, background 0.2s; background: transparent; border: 1px solid var(--color-border); position: relative; cursor: grab; }
        .chk-item-row:hover { background: var(--color-bg); }
        .chk-item-row:active { cursor: grabbing; }

<body>

                <li class="nav-item" data-target="calendar">📆 <span id="menu-name-calendar">업무 캘린더</span></li>
                <li class="nav-item" data-target="report">📝 <span id="menu-name-report">업무 보고서</span></li>
                <li class="nav-item" data-target="checklist">✅ <span id="menu-name-checklist">업무 체크리스트</span></li>
                <li class="nav-item" data-target="monthly">🗓️ <span id="menu-name-monthly">매월 체크리스트</span></li>
                <li class="nav-item hidden" data-target="admin" id="nav-admin">⚙️ <span id="menu-name-admin">설정</span></li>
            </ul>
            <div class="sidebar-footer">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.75rem;">
                    <div id="user-info" style="font-weight: 700; color: var(--color-text-main); font-size:0.9rem;"></div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-icon" id="btn-change-pw-self" title="내 비밀번호 변경">🔑</button>

                    </div>

            </div>
        </aside>
        <main id="main-content"><div id="content-area"></div></main>
    </div>
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAl6OzWJYAXoPBN7qAhMrwGFnesxjJ1V0",
            authDomain: "quickwork-c073d.firebaseapp.com",
            projectId: "quickwork-c073d",
            storageBucket: "quickwork-c073d.firebasestorage.app",
            messagingSenderId: "814147288024",
            appId: "1:814147288024:web:12e64c049dc6774b3810ad"
        };

        const app = initializeApp(firebaseConfig);
        const firestoreDB = getFirestore(app);

        const DB_KEY = 'AppDB';
        const defaultDB = {
            users: [{ id: 'admin', pw: '1111', role: 'admin', status: 'approved', name: '최고관리자', group: '운영팀', menus: ['dashboard','calendar','report','checklist','monthly','admin'] }],
            groups: [{ id: 1, name: '운영팀' }, { id: 2, name: '개발팀' }, { id: 3, name: '영업팀' }],
            settings: { sysTitle: 'QuickWork', menuNames: { dashboard: '업무 대시보드', calendar: '업무 캘린더', report: '업무 보고서', checklist: '업무 체크리스트', monthly: '매월 체크리스트', admin: '설정' }, notice: '새로운 업무 시스템에 오신 것을 환영합니다!' }
        };
        
        let globalDB = null; 
        let globalTasks = []; 
        let globalChecklists = [];
        let globalMonthlyChecklists = [];
        let globalReports = [];
        let globalReportRemarks = {};
        let isDBConnected = false; 

        function getDB() { return globalDB; }

        async function saveDB(data) { 
            if (!isDBConnected) return; 
            globalDB = data;
            try { await setDoc(doc(firestoreDB, "WorkSystem", DB_KEY), globalDB); } 
            catch (e) { console.error("데이터 저장 오류:", e); }
        }

        function triggerRefreshIfActive(targetMenu) {
            const activeNav = document.querySelector('.nav-item.active');
            if (!activeNav) return;
            
            if (activeNav.dataset.target === targetMenu) {
                if (window.isDragging) {
                    window.pendingRealtimeUpdate = true;
                    return;
                }

                const el = document.activeElement;
                const activeTag = el ? el.tagName : '';
                const isTextInput = activeTag === 'TEXTAREA' || 
                                    (activeTag === 'INPUT' && ['text', 'date', 'month', 'password', 'search'].includes(el.type));
                const isHidden = el && el.closest('.hidden') !== null;

                if (isTextInput && !isHidden) {
                    window.pendingRealtimeUpdate = true;
                    if(!window.toastTimeout) {
                        showToast("💡 실시간 업데이트 대기 중... (입력 완료 후 바탕 클릭 시 반영)");
                        window.toastTimeout = setTimeout(()=> { window.toastTimeout = null; }, 3000);
                    }
                } else {
                    refreshCurrentView(targetMenu);
                }
            }
        }

        function refreshCurrentView(target) {
            if (target === 'dashboard') renderDashList();
            else if (target === 'calendar') renderCalendar();
            else if (target === 'report') { if (reportState.tab === 'archive') renderArchive(document.getElementById('report-content-area')); else renderReportContent(); }
            else if (target === 'checklist') renderChecklist();
            else if (target === 'monthly') renderMonthlyChecklist();
            else if (target === 'admin') initAdmin(document.getElementById('content-area'));
        }

        async function initDB() { 
            try {
                const docRef = doc(firestoreDB, "WorkSystem", DB_KEY);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    globalDB = docSnap.data(); 
                    isDBConnected = true; 
                    
                    let needsAppDBSave = false;

                    if (globalDB.tasks && globalDB.tasks.length > 0) {
                        for (let i=0; i<globalDB.tasks.length; i++) { const t = globalDB.tasks[i]; t.order = i; await setDoc(doc(firestoreDB, "tasks", String(t.id)), t); }
                        globalDB.tasks = []; needsAppDBSave = true;
                    }
                    if (globalDB.checklists && globalDB.checklists.length > 0) {
                        for (let i=0; i<globalDB.checklists.length; i++) { const c = globalDB.checklists[i]; c.order = i; await setDoc(doc(firestoreDB, "checklists", String(c.id)), c); }
                        globalDB.checklists = []; needsAppDBSave = true;
                    }
                    if (globalDB.monthlyChecklists && globalDB.monthlyChecklists.length > 0) {
                        for (let i=0; i<globalDB.monthlyChecklists.length; i++) { const c = globalDB.monthlyChecklists[i]; c.order = i; await setDoc(doc(firestoreDB, "monthlyChecklists", String(c.id)), c); }
                        globalDB.monthlyChecklists = []; needsAppDBSave = true;
                    }
                    if (globalDB.reports && globalDB.reports.length > 0) {
                        for (let r of globalDB.reports) { await setDoc(doc(firestoreDB, "reports", String(r.id)), r); }
                        globalDB.reports = []; needsAppDBSave = true;
                    }
                    if (globalDB.reportRemarks && Object.keys(globalDB.reportRemarks).length > 0) {
                        for (let [key, arr] of Object.entries(globalDB.reportRemarks)) { await setDoc(doc(firestoreDB, "reportRemarks", key), { remarks: arr }); }
                        globalDB.reportRemarks = {}; needsAppDBSave = true;
                    }
                    
                    if (!globalDB.users || globalDB.users.length === 0) { globalDB.users = JSON.parse(JSON.stringify(defaultDB.users)); needsAppDBSave = true; }
                    if (!globalDB.settings) { globalDB.settings = JSON.parse(JSON.stringify(defaultDB.settings)); needsAppDBSave = true; }
                    if (!globalDB.settings.menuNames.calendar) { globalDB.settings.menuNames.calendar = '업무 캘린더'; needsAppDBSave = true; }
                    
                    if (!globalDB.monthlyChecklistInit) { globalDB.monthlyChecklistInit = {}; needsAppDBSave = true; }
                    if (!globalDB.groups) { globalDB.groups = defaultDB.groups; needsAppDBSave = true; }
                    
                    globalDB.users.forEach(u => {
                        if (!u.menus) { u.menus = ['dashboard', 'calendar', 'report', 'checklist', 'monthly']; needsAppDBSave = true; }
                        if (!u.menus.includes('calendar')) { u.menus.splice(1, 0, 'calendar'); needsAppDBSave = true; }
                        if (!u.menus.includes('monthly')) { u.menus.push('monthly'); needsAppDBSave = true; }
                        if (u.role === 'admin' && !u.menus.includes('admin')) { u.menus.push('admin'); needsAppDBSave = true; }
                        if (!u.group) { u.group = '운영팀'; needsAppDBSave = true; }
                    });

                    if (needsAppDBSave) await saveDB(globalDB);

                } else {
                    globalDB = JSON.parse(JSON.stringify(defaultDB));
                    globalDB.monthlyChecklistInit = {};
                    isDBConnected = true; 
                    await saveDB(globalDB);
                }

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if(globalDB) {
                            globalDB.users = data.users || defaultDB.users;
                            globalDB.settings = data.settings || defaultDB.settings;
                            globalDB.groups = data.groups || defaultDB.groups;
                            globalDB.monthlyChecklistInit = data.monthlyChecklistInit || {};
                            triggerRefreshIfActive('admin');
                        }
                    }
                });

                onSnapshot(collection(firestoreDB, "tasks"), (snapshot) => {
                    globalTasks = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data.subItems) data.subItems = [];
                        return data;
                    }).sort((a, b) => (a.order || 0) - (b.order || 0));
                    triggerRefreshIfActive('dashboard');
                    triggerRefreshIfActive('calendar'); 
                    
                    const editModalBody = document.getElementById('task-edit-modal-body');
                    const modal = document.getElementById('task-edit-modal');
                    if (editModalBody && modal && !modal.classList.contains('hidden')) {
                        const card = editModalBody.querySelector('.task-card');
                        if (card) {
                            const taskId = Number(card.dataset.id);

                            if (updatedT) editModalBody.innerHTML = createCardHTML({...updatedT, isOpen: true});
                            else modal.classList.add('hidden'); 
                        }
                    }
                });

                onSnapshot(collection(firestoreDB, "checklists"), (snapshot) => {
                    globalChecklists = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data.items) data.items = [];
                        return data;
                    }).sort((a, b) => {
                        if(a.order !== undefined && b.order !== undefined) return a.order - b.order;
                        return b.id - a.id;
                    });
                    triggerRefreshIfActive('checklist');
                });

                onSnapshot(collection(firestoreDB, "monthlyChecklists"), (snapshot) => {
                    globalMonthlyChecklists = snapshot.docs.map(d => {
                        let data = d.data();
                        if(!data.items) data.items = [];
                        return data;
                    }).sort((a, b) => {
                        if(a.order !== undefined && b.order !== undefined) return a.order - b.order;
                        return b.id - a.id;
                    });
                    triggerRefreshIfActive('monthly');
                });

                onSnapshot(collection(firestoreDB, "reports"), (snapshot) => {
                    globalReports = snapshot.docs.map(d => d.data()).sort((a, b) => b.id - a.id);
                    triggerRefreshIfActive('report');
                });

                onSnapshot(collection(firestoreDB, "reportRemarks"), (snapshot) => {
                    globalReportRemarks = {};
                    snapshot.forEach(d => { globalReportRemarks[d.id] = d.data().remarks || []; });
                    triggerRefreshIfActive('report');
                });

            } catch (e) {
                console.error("Firebase 로딩 오류:", e);
                globalDB = JSON.parse(JSON.stringify(defaultDB)); 
                globalDB.monthlyChecklistInit = {};
                isDBConnected = false;

        function autoResizeTextarea(el) {
            if (!el || el.tagName !== 'TEXTAREA') return;

            const modalScroll = modalContent ? modalContent.scrollTop : 0;
            const winScrollX = window.scrollX;
            const winScrollY = window.scrollY;

            el.style.height = (el.scrollHeight) + 'px'; 

            if (chkBody) chkBody.scrollTop = chkBodyScroll;

        function getCurrentUserId() { const session = sessionStorage.getItem('currentUser'); return session ? JSON.parse(session).id : null; }
        function toLocalISOString(dateObj) { const tz = dateObj.getTimezoneOffset() * 60000; return (new Date(dateObj.getTime() - tz)).toISOString().split('T')[0]; }
        function getTodayString() { return toLocalISOString(new Date()); }
        function formatShortDate(dateStr) { if (!dateStr) return '미정'; const d = new Date(dateStr); return `${String(d.getFullYear()).slice(2)}년 ${d.getMonth()+1}월 ${d.getDate()}일`; }
        function getDaysDiff(startStr, endStr) { if (!startStr || !endStr) return 0; return Math.floor((new Date(endStr) - new Date(startStr)) / (1000 * 60 * 60 * 24)) + 1; }
        function getWeekInfo(dateStr) { const date = dateStr ? new Date(dateStr) : new Date(); const year = date.getFullYear(), month = date.getMonth() + 1, firstDay = new Date(year, month - 1, 1).getDay(); return { year, month, week: Math.ceil((date.getDate() + firstDay) / 7) }; }
        function getCurrentMondayStr() { const today = new Date(), day = today.getDay(), diff = today.getDate() - day + (day === 0 ? -6 : 1); return toLocalISOString(new Date(today.setDate(diff))); }

        /* 🚨 미래 월 자동 연동 (Cascading Updates) 헬퍼 */
        function getMonthDiff(m1, m2) {
            const [y1, mo1] = m1.split('-').map(Number);
            const [y2, mo2] = m2.split('-').map(Number);
            return (y2 - y1) * 12 + (mo2 - mo1);
        }

        function getInitializedFutureMonths(db, uid, currentMonth) {
            if (!globalDB.monthlyChecklistInit) return [];
            return Object.keys(globalDB.monthlyChecklistInit)
                .filter(k => k.startsWith(`${uid}_`))
                .map(k => k.replace(`${uid}_`, ''))
                .filter(m => m > currentMonth)
                .sort();
        }

        async function syncFutureGroupAdd(uid, currentMonth, newGroup) {
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const copy = { ...newGroup, id: Date.now() + Math.random(), month: m, items: newGroup.items.map(i => ({...i, id: Date.now() + Math.random()})) };
                await setDoc(doc(firestoreDB, "monthlyChecklists", String(copy.id)), copy);
            }
        }

        async function syncFutureGroupTitle(uid, currentMonth, syncGroupId, newTitle) {
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const targetGroup = globalMonthlyChecklists.find(c => c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                if (targetGroup) await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { title: newTitle });
            }
        }

        async function syncFutureGroupDelete(uid, currentMonth, syncGroupId) {
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const targetGroup = globalMonthlyChecklists.find(c => c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                if (targetGroup) await deleteDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)));
            }
        }

        async function syncFutureItemAdd(uid, currentMonth, syncGroupId, item) {
            if (item.status === '당월') return;
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const targetGroup = globalMonthlyChecklists.find(c => c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                if (targetGroup) {
                    const monthDiff = getMonthDiff(currentMonth, m);
                    if (item.status === '고정') { let newItem = { ...item, id: Date.now() + Math.random(), isChecked: false }; targetGroup.items.push(newItem); } 
                    else if (item.status === '이월' && monthDiff === 1) { let newItem = { ...item, id: Date.now() + Math.random(), isChecked: false, status: '당월' }; targetGroup.items.push(newItem); }
                    await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });
                }
            }
        }

        async function syncFutureItemDelete(uid, currentMonth, syncItemId) {
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const targetGroup = globalMonthlyChecklists.find(c => c.userId === uid && c.month === m && c.items.some(i => i.syncItemId === syncItemId));
                if (targetGroup) {
                    targetGroup.items = targetGroup.items.filter(i => i.syncItemId !== syncItemId);
                    await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });
                }
            }
        }

        async function syncFutureItemEdit(uid, currentMonth, syncGroupId, editedItem) {
            const futureMonths = getInitializedFutureMonths(globalDB, uid, currentMonth);
            for(let m of futureMonths) {
                const targetGroup = globalMonthlyChecklists.find(c => c.userId === uid && c.month === m && c.syncGroupId === syncGroupId);
                if (targetGroup) {
                    const targetIdx = targetGroup.items.findIndex(i => i.syncItemId === editedItem.syncItemId);
                    const monthDiff = getMonthDiff(currentMonth, m);
                    
                    let shouldExist = false; let futureStatus = '';
                    if (editedItem.status === '고정') { shouldExist = true; futureStatus = '고정'; } 
                    else if (editedItem.status === '이월' && monthDiff === 1) { shouldExist = true; futureStatus = '당월'; }
                    
                    if (!shouldExist) {
                        if (targetIdx !== -1) targetGroup.items.splice(targetIdx, 1);
                    } else {
                        if (targetIdx !== -1) {
                            targetGroup.items[targetIdx].text = editedItem.text;
                            targetGroup.items[targetIdx].memos = [...(editedItem.memos || [])];
                            targetGroup.items[targetIdx].status = futureStatus;
                            targetGroup.items[targetIdx].isMemoOpen = editedItem.isMemoOpen;
                        } else {
                            let newItem = { ...editedItem, id: Date.now() + Math.random(), isChecked: false, status: futureStatus };
                            targetGroup.items.push(newItem);
                        }
                    }
                    await updateDoc(doc(firestoreDB, "monthlyChecklists", String(targetGroup.id)), { items: targetGroup.items });
                }
            }
        }

                            <span>보류 (${h.length})</span>
                            <button class="btn-icon btn-sort-tasks" data-status="보류" title="시작일 기준 오름차순 정렬" style="font-size:0.75rem; padding:0.2rem 0.4rem; border:1px solid var(--color-border); background:var(--color-surface); border-radius:4px; color:var(--color-text-sub);">📅 정렬</button>
                        </div>
                        <div class="task-list-wrap">${h.map(createCardHTML).join('')}</div>
                    </div>
                </div>`;
            } else {
                const completed = filtered.filter(t => t.status === '완료');
                if (completed.length === 0) container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--color-text-sub);">완료된 업무가 없습니다.</div>`;
                else container.innerHTML = `<div class="task-list grid-view task-list-wrap">${completed.map(createCardHTML).join('')}</div>`;
            }
            requestAnimationFrame(resizeAllTextareas);
        }

        /* =========================================
           🚨 캘린더 로직
           ========================================= */
        let calState = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
        function initCalendar(container) {
            container.innerHTML = `
                <div class="dashboard-header">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <h2 style="font-size:1.5rem; font-weight:800; color:var(--color-text-main);">📆 업무 캘린더</h2>
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <button class="btn-icon btn-cal-prev" style="background:var(--color-primary-light); color:var(--color-primary);">◀</button>
                            <span id="cal-month-display" style="font-size:1.2rem; font-weight:800; min-width:100px; text-align:center; color:var(--color-text-main);">${calState.year}년 ${calState.month}월</span>
                            <button class="btn-icon btn-cal-next" style="background:var(--color-primary-light); color:var(--color-primary);">▶</button>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline" id="btn-cal-today" style="margin-right: 0.5rem;">오늘</button>
                        <button class="btn btn-primary" id="btn-add-task">+ 새 업무 추가</button>
                    </div>
                </div>
                <div id="calendar-container"></div>
            `;
            renderCalendar();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-container'); if(!container) return;
            
            const monthDisplay = document.getElementById('cal-month-display');
            if(monthDisplay) monthDisplay.textContent = `${calState.year}년 ${calState.month}월`;
            
            const uid = getCurrentUserId();
            const firstDay = new Date(calState.year, calState.month - 1, 1).getDay();
            const lastDate = new Date(calState.year, calState.month, 0).getDate();
            const prevLastDate = new Date(calState.year, calState.month - 1, 0).getDate();
            
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            let html = '<div class="calendar-grid">';
            const days = ['일','월','화','수','목','금','토'];
            days.forEach(d => html += `<div class="cal-day-name" style="${d==='일'?'color:#EF4444;':d==='토'?'color:#3B82F6;':''}">${d}</div>`);
            
            let dateNum = 1;
            let nextMonthDate = 1;

            const myTasks = globalTasks.filter(t => t.userId === uid);

            for (let i = 0; i < 42; i++) { 
                let cellDateStr = '';
                let cellClass = 'cal-cell';
                let dayDisplay = '';
                
                if (i < firstDay) {
                    cellClass += ' other-month';
                    let d = prevLastDate - firstDay + i + 1;
                    dayDisplay = d;
                    let pm = calState.month - 1; let py = calState.year;
                    if (pm < 1) { pm = 12; py--; }
                    cellDateStr = `${py}-${String(pm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                } else if (dateNum > lastDate) {
                    cellClass += ' other-month';
                    dayDisplay = nextMonthDate;
                    let nm = calState.month + 1; let ny = calState.year;
                    if (nm > 12) { nm = 1; ny++; }
                    cellDateStr = `${ny}-${String(nm).padStart(2,'0')}-${String(nextMonthDate).padStart(2,'0')}`;
                    nextMonthDate++;
                } else {
                    cellDateStr = `${calState.year}-${String(calState.month).padStart(2,'0')}-${String(dateNum).padStart(2,'0')}`;
                    let isToday = (cellDateStr === todayStr);
                    dayDisplay = `<div style="display:flex; justify-content:flex-end;"><span class="cal-date ${isToday?'today':''}">${dateNum}</span></div>`;
                    dateNum++;
                }

                let tasksHtml = '';
                if (cellDateStr) {
                    const dayTasks = myTasks.filter(t => {
                        if (!t.startDate && t.status !== '완료') return false; 
                        
                        if (t.status === '완료') {
                            return t.endDate === cellDateStr;
                        } else {
                            return t.startDate === cellDateStr;
                        }
                    });

                    dayTasks.sort((a, b) => (a.order || 0) - (b.order || 0));

                    dayTasks.sort((a, b) => {
                        if (a.status === '완료' && b.status !== '완료') return 1;
                        if (a.status !== '완료' && b.status === '완료') return -1;
                        return 0;
                    });

                    tasksHtml = dayTasks.map(t => {
                        let color = t.status === '완료' ? '#94A3B8' : (t.status === '진행중' ? 'var(--status-ing)' : (t.status === '보류' ? 'var(--status-hold)' : 'var(--status-wait)'));
                        let extraStyle = t.status === '완료' ? 'opacity: 0.8;' : '';
                        return `<div class="cal-task-badge" draggable="true" data-task-id="${t.id}" style="background-color:${color}; ${extraStyle}" title="${t.title}">${t.title}</div>`;
                    }).join('');
                }

                if(i < firstDay || (i >= firstDay && dayDisplay.toString().indexOf('<div') === -1)) {
                    dayDisplay = `<div style="display:flex; justify-content:flex-end;"><span class="cal-date">${dayDisplay}</span></div>`;
                }

                html += `<div class="${cellClass}" data-date="${cellDateStr}">${dayDisplay}${tasksHtml}</div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        /* =========================================
           4. 보고서 로직 
           ========================================= */
        let reportState = { tab: 'weekly', selectedWeek: '', selectedMonth: '' };
        function generateWeeklyOptions() {
            let options = ''; const currentMonday = new Date(getCurrentMondayStr());
            for(let i=0; i<12; i++) {
                const m = new Date(currentMonday); m.setDate(m.getDate() - (i * 7)); const dateStr = toLocalISOString(m); const info = getWeekInfo(dateStr);
                const label = i === 0 ? `현재 주차 (${info.year}년 ${info.month}월 ${info.week}주차)` : `${info.year}년 ${info.month}월 ${info.week}주차`;
                options += `<option value="${dateStr}" ${(reportState.selectedWeek === dateStr) ? 'selected' : ''}>${label}</option>`;
            } return `<select id="select-weekly" class="input-text" style="width:260px; font-weight:700; cursor:pointer;">${options}</select>`;
        }
        function generateMonthlyOptions() {
            let options = ''; const today = new Date();
            for(let i=0; i<6; i++) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1); const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const label = i === 0 ? `이번 달 (${d.getFullYear()}년 ${d.getMonth() + 1}월)` : `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
                options += `<option value="${val}" ${(reportState.selectedMonth === val) ? 'selected' : ''}>${label}</option>`;
            } return `<select id="select-monthly" class="input-text" style="width:220px; font-weight:700; cursor:pointer;">${options}</select>`;
        }
        function initReport(container) {
            container.innerHTML = `<div class="tabs"><button class="tab-btn report-tab ${reportState.tab === 'weekly' ? 'active' : ''}" data-tab="weekly">주간 보고서</button><button class="tab-btn report-tab ${reportState.tab === 'monthly' ? 'active' : ''}" data-tab="monthly">월간 보고서</button><button class="tab-btn report-tab ${reportState.tab === 'archive' ? 'active' : ''}" data-tab="archive">보고서 리스트</button></div><div id="report-content-area"></div>`;
            if (reportState.tab === 'archive') renderArchive(document.getElementById('report-content-area')); else renderReportContent();
        }
        function renderReportContent() {
            const area = document.getElementById('report-content-area'); let controls = reportState.tab === 'weekly' ? generateWeeklyOptions() : generateMonthlyOptions();
            const { title, html } = generateReportHTML(reportState.tab);
            area.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem; background:var(--color-surface); padding:1rem 1.5rem; border-radius:8px; border:1px solid var(--color-border); box-shadow:var(--shadow-sm);"><div style="display:flex; align-items:center; gap:1rem;"><span style="font-weight:700; color:var(--color-text-sub);">기간 선택:</span>${controls}</div><button class="btn btn-primary" id="btn-save-report">📥 현재 보고서 스냅샷 저장</button></div>
                <div class="report-paper" id="current-report-paper"><div class="report-header"><div class="report-title-main">${title}</div><div class="report-meta">작성일자: ${formatShortDate(getTodayString())}</div></div>${html}</div>`;
            requestAnimationFrame(resizeAllTextareas);
        }
        function generateReportHTML(type) {
            const uid = getCurrentUserId();
            let periodStart, periodEnd, title, remarkKey;
            
            if (type === 'weekly') {
                if (!reportState.selectedWeek) reportState.selectedWeek = getCurrentMondayStr();
                periodStart = new Date(reportState.selectedWeek); periodEnd = new Date(periodStart); periodEnd.setDate(periodStart.getDate() + 6);
                const info = getWeekInfo(reportState.selectedWeek); title = `${info.year}년 ${info.month}월 ${info.week}주차\n주간 업무보고서`; remarkKey = `weekly-${reportState.selectedWeek}`;
            } else {
                if (!reportState.selectedMonth) reportState.selectedMonth = getCurrentMonthStr();
                const [y, m] = reportState.selectedMonth.split('-'); periodStart = new Date(y, m - 1, 1); periodEnd = new Date(y, m, 0);
                title = `${y}년 ${parseInt(m)}월\n월간 업무보고서`; remarkKey = `monthly-${reportState.selectedMonth}`;
            }
            const pStartStr = toLocalISOString(periodStart), pEndStr = toLocalISOString(periodEnd);
            
            let targetTasks = globalTasks.filter(t => { 
                if (t.userId !== uid) return false;
                if (t.status === '대기' || t.status === '보류' || !t.startDate) return false;
                const end = (t.status === '완료' && t.endDate) ? t.endDate : '9999-12-31';
                if (t.status === '완료' && end >= pStartStr && end <= pEndStr) { t._reportStatus = '완료'; return true; }
                if (t.startDate <= pEndStr && end >= pStartStr && !(t.status === '완료' && end >= pStartStr && end <= pEndStr)) { t._reportStatus = '진행중'; return true; }
                return false;
            });
            targetTasks.sort((a, b) => new Date(a.startDate).getTime() - new Date(b.startDate).getTime());
            
            if (targetTasks.length === 0) return { title, html: '<div style="text-align:center; color:#94A3B8; padding:3rem; font-size:1.1rem;">보고할 업무가 없습니다.</div>' };
            const grouped = {}; targetTasks.forEach(t => { if (!grouped[t.category]) grouped[t.category] = {}; if (!grouped[t.category][t._reportStatus]) grouped[t.category][t._reportStatus] = []; grouped[t.category][t._reportStatus].push(t); });
            
            let html = ''; const statusOrder = ['완료', '진행중']; 
            for (const [category, statusGroup] of Object.entries(grouped)) {
                html += `<div class="group-category"><div class="group-category-title">${category}</div>`;
                statusOrder.forEach(status => {
                    if (statusGroup[status] && statusGroup[status].length > 0) {
                        const isDone = status === '완료';
                        const statusClass = isDone ? 'done' : 'ing';
                        const statusLabel = isDone ? '완료된 업무' : '진행 중인 업무';
                        
                        html += `<div class="group-status ${statusClass}"><div class="group-status-title ${statusClass}">${statusLabel}</div>`;
                        statusGroup[status].forEach(t => {
                            let dateStr = '';
                            if (t.startDate) {
                                dateStr = `<div>${formatShortDate(t.startDate)} ~ ${isDone && t.endDate ? formatShortDate(t.endDate) : '진행 중'}</div>`;
                                if (isDone && t.endDate) dateStr += `<div style="margin-top:6px;"><span class="duration-badge">${getDaysDiff(t.startDate, t.endDate)}일 소요</span></div>`;
                            } else dateStr = `<div>일정 미정</div>`;
                            
                            let subsHtml = t.subItems && t.subItems.length > 0 ? `<ul class="report-task-subs">${t.subItems.filter(s => s.text.trim()!=='').map(s => `<li>- ${s.text}</li>`).join('')}</ul>` : '';
                            
                            html += `
                                <div class="report-task">
                                    <div class="report-task-content"><div class="report-task-title">${t.title}</div>${subsHtml}</div>
                                    <div class="report-task-date">${dateStr}</div>
                                </div>
                            `;
                        }); html += `</div>`;
                    }
                }); html += `</div>`;
            }
            const userRemarks = (globalReportRemarks[remarkKey] || []).filter(r => r.userId === uid);
            html += `<div class="group-category" style="margin-top: 3.5rem; border-top: 2px dashed var(--color-border); padding-top: 2.5rem;"><div class="group-category-title" style="border-bottom:none; margin-bottom: 0.5rem;">비고 및 특이사항</div><div class="report-remarks-list" data-remark-key="${remarkKey}">
                        ${userRemarks.map(r => `<div class="sub-item-row" data-sub-id="${r.id}" style="margin-bottom:0.5rem; align-items:flex-start; width:100%;"><span style="color:var(--color-text-sub); padding-top:0.3rem;">•</span><textarea spellcheck="false" rows="1" class="inline-input remark-text" style="flex:1; width:100%; border-bottom: 1px dashed var(--color-border); border-radius: 0;">${r.text}</textarea><button class="btn-icon btn-del-remark" style="margin-top:0.1rem;">✕</button></div>`).join('')}
                        <button class="btn-add-remark" style="margin-top: 1rem;">+ 특이사항 추가</button></div></div>`;
            return { title, html };
        }
        function renderArchive(area) {
            const uid = getCurrentUserId();
            const userReports = globalReports.filter(r => r.userId === uid); 
            if (userReports.length === 0) { area.innerHTML = `<div style="text-align:center; padding:4rem; color:var(--color-text-sub);">저장된 보고서가 없습니다.</div>`; return; }
            area.innerHTML = `<div class="archive-list">${userReports.map(r => `<div class="archive-item" data-id="${r.id}"><div><div class="archive-title">${r.title.replace('\n', ' ')}</div><div class="archive-date">저장일자: ${new Date(r.id).toLocaleString()}</div></div><button class="btn-icon btn-delete-report" style="font-size:1.2rem;">🗑️</button></div>`).join('')}</div>`;
        }

        /* =========================================
           5. 체크리스트 로직
           ========================================= */
        function getChecklistHTML(c, isMonthly) {
            let items = Array.isArray(c.items) ? c.items : [];
            let totalItems = items.length;
            let checkedItems = items.filter(i => i && i.isChecked).length;
            let progress = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);

            let progressHTML = `
                <div class="chk-progress-wrap">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--color-text-sub); margin-bottom:0.1rem;">
                        <span style="font-weight:600;">달성률</span><span style="font-weight:700; color:var(--color-primary);">${progress}%</span>
                    </div>
                    <div class="chk-progress-bar"><div class="chk-progress-fill" style="width:${progress}%;"></div></div>
                </div>
            `;

            return `
                <div class="chk-card" draggable="true" data-chk-id="${c.id}" data-is-monthly="${isMonthly}">
                    <div class="chk-header">
                        <button class="btn-toggle-chk">${c.isOpen === false ? '▶' : '▼'}</button>
                        <textarea spellcheck="false" rows="1" class="inline-input chk-title" placeholder="제목 입력" style="font-size:1.15rem; font-weight:800; color:var(--color-primary); background:transparent; border-color:transparent;">${c.title}</textarea>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-icon btn-add-chk-item" title="항목 추가" style="color:var(--color-primary);">➕</button>
                            <button class="btn-icon btn-uncheck-all" title="전체 해제">🔄</button>
                            <button class="btn-icon btn-del-chk" title="그룹 삭제">🗑️</button>
                        </div>
                    </div>
                    ${progressHTML}
                    <div class="chk-body ${c.isOpen === false ? 'hidden' : ''}">
                        <div class="chk-item-wrap">
                        ${items.map(i => {
                            if(!i) return '';
                            let memos = Array.isArray(i.memos) ? i.memos : [];
                            const memoOpen = i.isMemoOpen !== false;
                            
                            let statusSelect = '';
                            if (isMonthly) {
                                statusSelect = `<select class="inline-select monthly-item-status" data-item-id="${i.id}" style="width:65px; font-size:0.75rem; padding:0.1rem; text-align:center;">
                                    <option value="당월" ${i.status==='당월'?'selected':''}>당월</option>
                                    <option value="고정" ${i.status==='고정'?'selected':''}>고정</option>
                                    <option value="이월" ${i.status==='이월'?'selected':''}>이월</option>
                                </select>`;
                            }
                            
                            return `<div class="chk-item-row ${i.isChecked ? 'completed' : ''}" draggable="true" data-item-id="${i.id}">
                                <span class="drag-handle" title="드래그하여 순서 변경">⋮⋮</span>
                                <input type="checkbox" class="chk-checkbox" ${i.isChecked ? 'checked' : ''}>
                                <div class="chk-inputs">
                                    <div style="display:flex; align-items:flex-start; gap:4px; width: 100%;">
                                        <textarea spellcheck="false" rows="1" class="inline-input chk-text" placeholder="항목 입력" style="flex:1;">${i.text}</textarea>
                                        ${statusSelect}
                                        <button class="btn-icon btn-toggle-memo" title="메모 접기/펼치기" style="font-size:0.75rem; padding:0.2rem; margin-top:0.2rem;">${memoOpen ? '💬▼' : '💬▶'}</button>
                                    </div>
                                    <div class="chk-memo-list ${memoOpen ? '' : 'hidden'}" style="width: 100%;">
                                        ${memos.map((m, mIdx) => `
                                            <div class="memo-row" draggable="true" style="display:flex; align-items:flex-start; gap:4px; margin-top:2px; width: 100%;">
                                                <span class="drag-handle memo-drag-handle" title="드래그하여 순서 변경">⋮⋮</span>
                                                <textarea spellcheck="false" rows="1" class="inline-input chk-memo" data-idx="${mIdx}" placeholder="메모 기재" style="flex:1; width: 100%;">${m}</textarea>
                                                <button class="btn-icon btn-del-memo" data-idx="${mIdx}" style="padding:0.1rem; font-size:0.7rem;">✕</button>
                                            </div>
                                        `).join('')}
                                        <button class="btn-add-memo" style="font-size:0.75rem; background:none; border:none; color:var(--color-primary); cursor:pointer; margin-top:4px; margin-left:1.2rem;">+ 메모 추가</button>
                                    </div>
                                </div>
                                <button class="btn-icon btn-del-chk-item">✕</button>
                            </div>`
                        }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        let chkState = { search: '' };
        function initChecklist(container) {
            container.innerHTML = `
                <div class="dashboard-header" style="margin-bottom: 2rem;">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <h2 style="font-size:1.5rem; font-weight:800; color:var(--color-text-main);">✅ 업무 체크리스트</h2>
                        <input type="text" id="chk-search" class="input-text" placeholder="제목/항목 검색..." value="${chkState.search}" style="width:300px;">
                    </div>
                    <button class="btn btn-primary" id="btn-add-checklist">+ 새 그룹</button>

                <div id="checklist-container"></div>
            `;
            renderChecklist();
        }
        function renderChecklist() {
            const container = document.getElementById('checklist-container'); if(!container) return;
            const lastScrollY = window.scrollY; const cardScrolls = new Map();
            document.querySelectorAll('.chk-card').forEach(card => { const body = card.querySelector('.chk-body'); if (body) cardScrolls.set(card.dataset.chkId, body.scrollTop); });

            const uid = getCurrentUserId();
            if(!Array.isArray(globalChecklists)) globalChecklists = [];
            let filtered = globalChecklists.filter(c => c && c.userId === uid); 
            
            if (chkState.search.trim() !== '') {
                const term = chkState.search.toLowerCase();
                filtered = filtered.filter(c => c.title.toLowerCase().includes(term) || (Array.isArray(c.items) && c.items.some(i => i && (i.text.toLowerCase().includes(term) || (Array.isArray(i.memos) && i.memos.some(m => m.toLowerCase().includes(term)))))));
            }
            if (!filtered || filtered.length === 0) { 
                container.innerHTML = `<div style="text-align:center; padding:5rem; color:var(--color-text-sub);">체크리스트가 없습니다.</div>`; return; 
            }
            container.innerHTML = `<div class="checklist-grid chk-list-wrap">${filtered.map(c => getChecklistHTML(c, false)).join('')}</div>`;

            requestAnimationFrame(() => {
                window.scrollTo(0, lastScrollY);
                document.querySelectorAll('.chk-card').forEach(card => { const body = card.querySelector('.chk-body'); const cId = card.dataset.chkId; if (body && cardScrolls.has(cId)) body.scrollTop = cardScrolls.get(cId); });
                resizeAllTextareas();
            });
        }

        let monthlyChkState = { search: '', month: getCurrentMonthStr() };
        function initMonthlyChecklist(container) {
            container.innerHTML = `
                <div class="dashboard-header" style="margin-bottom: 2rem;">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <h2 style="font-size:1.5rem; font-weight:800; color:var(--color-text-main);">🗓️ 매월 체크리스트</h2>

        async function renderMonthlyChecklist() {
            const container = document.getElementById('monthly-checklist-container'); if(!container) return;
            const lastScrollY = window.scrollY; const cardScrolls = new Map();
            document.querySelectorAll('.chk-card').forEach(card => { const body = card.querySelector('.chk-body'); if (body) cardScrolls.set(card.dataset.chkId, body.scrollTop); });

            const uid = getCurrentUserId();
            await ensureMonthInitialized(globalDB, uid, monthlyChkState.month);
            
            if(!Array.isArray(globalMonthlyChecklists)) globalMonthlyChecklists = [];
            let filtered = globalMonthlyChecklists.filter(c => c && c.userId === uid && c.month === monthlyChkState.month); 

            if (filtered.length === 0) { container.innerHTML = `<div style="text-align:center; padding:5rem; color:var(--color-text-sub);">해당 월에 데이터가 없습니다.</div>`; return; }
            container.innerHTML = `<div class="checklist-grid chk-list-wrap">${filtered.map(c => getChecklistHTML(c, true)).join('')}</div>`;

            requestAnimationFrame(() => {
                window.scrollTo(0, lastScrollY);
                document.querySelectorAll('.chk-card').forEach(card => { const body = card.querySelector('.chk-body'); const cId = card.dataset.chkId; if (body && cardScrolls.has(cId)) body.scrollTop = cardScrolls.get(cId); });
                resizeAllTextareas();
            });
        }
